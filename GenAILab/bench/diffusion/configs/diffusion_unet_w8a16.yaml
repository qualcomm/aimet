# Stable Diffusion 1.5 with a W8A16 UNet (aimet_onnx QuantSim); the text encoder
# and VAE decoder stay in float. The UNet is calibrated on 32 PartiPrompts that
# no metric below scores. ONNX only, fp32 base dtype only:
#   python -m GenAILab.bench.onnx.run_diffusion --config <this file>
# See GenAILab/bench/diffusion/README.md for the config schema.
model:
  model_id: stable-diffusion-v1-5/stable-diffusion-v1-5
  num_inference_steps: 10
  guidance_scale: 7.5
precision:
  unet:
    weight:
      qtype: int8
      granularity: PCQ
    activations: int16
recipe:
  name: Calibration
  num_prompts: 32
metrics:
  - name: CLIPScore
    num_prompts: 64
  - name: ImageDump
    num_prompts: 8
