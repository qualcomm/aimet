# Stable Diffusion 1.5 FP inference (torch). Run with:
#   python -m GenAILab.bench.torch.run_diffusion --config <this file>
# See GenAILab/bench/diffusion/README.md for the config schema.
model:
  model_id: stable-diffusion-v1-5/stable-diffusion-v1-5
  num_inference_steps: 10
  guidance_scale: 7.5
metrics:
  - name: CLIPScore
    num_prompts: 64
  - name: ImageDump
    num_prompts: 8
---
model:
  model_id: stable-diffusion-v1-5/stable-diffusion-v1-5
  dtype: float16
  num_inference_steps: 10
  guidance_scale: 7.5
metrics:
  - name: CLIPScore
    num_prompts: 64
  - name: ImageDump
    num_prompts: 8
