# Run: python -m GenAILab --framework onnx --config GenAILab/configs/recipes/gemma-4-e4b-it/pcq_seqmse.yaml
model:
  model_id: google/gemma-4-E4B-it
  sequence_length: 2048
  context_length: 4096
precision:
  activations: int16
  kv_cache: int8
  embedding: int16
  lm_head:
    qtype: int8
    granularity: PCQ
  blocks:
    qtype: int4
    granularity: PCQ
recipe:
  backbone:
    - name: SeqMSE
      num_iterations: 20
      dataset:
        name: Wikitext
        split: train
    - name: Calibration
      num_iterations: 20
      dataset:
        name: Wikitext
        split: train
  visual:
    - name: RemoveQuantization
metrics:
  - name: MMLU
