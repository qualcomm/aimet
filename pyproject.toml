[build-system]
requires = [
  "scikit-build-core[wheels]==0.11.1",
  "build",
  "pybind11",
  "cython>=3.0",
]
build-backend = "scikit_build_core.build"

[project]
authors = [
    { name = "Qualcomm Innovation Center, Inc." },
    { name = "Qualcomm Innovation Center, Inc.", email = "aimet.os@quicinc.com" },
]
name = "aimet-torch"  # Placeholder; the real name (aimet-torch / aimet-onnx) comes from packaging/plugins/local/aimet.py
requires-python = ">=3.10"
dynamic = ["name", "dependencies", "version", "optional-dependencies", "description"]
license = {text = "BSD-3-Clause"}
readme = "README.md"

[project.urls]
Homepage = "https://github.com/qualcomm/aimet"
Documentation = "https://qualcomm.github.io/aimet-pages/releases/latest/index.html"

[tool.scikit-build]
experimental = true
metadata.name = { provider = "aimet", provider-path = "packaging/plugins/local" }
metadata.dependencies = { provider = "aimet", provider-path = "packaging/plugins/local" }
metadata.version = { provider = "aimet", provider-path = "packaging/plugins/local" }
metadata.optional-dependencies = { provider = "aimet", provider-path = "packaging/plugins/local" }
metadata.description = { provider = "aimet", provider-path = "packaging/plugins/local" }
build-dir = "build"
sdist.cmake = false
logging.level = "DEBUG"
strict-config = false
wheel.license-files=[]
wheel.packages=[]
wheel.py-api = "cp310"  # Stable ABI: wheel works with Python 3.10+

[tool.scikit-build.cmake]
minimum-version = "3.26"

[tool.scikit-build.cmake.define]
CMAKE_BUILD_TYPE="RelWithDebInfo"
CMAKE_CUDA_ARCHITECTURES="70;75;80"
CMAKE_CUDA_FLAGS="--threads=8"

[tool.pytest.ini_options]
xfail_strict = true
required_plugins = [
    "pytest-xdist",
    "pytest-extra-durations",
]
addopts = [
    "-ra",
    "--showlocals",
    "--strict-markers",
    "--strict-config",
    "--dist=loadgroup", # Don't parallelize tests within the same xdist_group
    "--modules-durations=10",
]
markers = [
    "cuda: tests that require CUDA.",
    "parallel: mark test as parallelizable",
]
