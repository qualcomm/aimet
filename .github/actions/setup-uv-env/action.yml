name: Setup UV environment with AIMET

description: Creates UV virtual environment and installs AIMET wheel

inputs:
  ENV_NAME:
    description: "UV environment name"
    required: true
  VER_PYTHON:
    description: "Python version"
    required: true

runs:
  using: "composite"
  steps:
    - name: Install uv (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      id: windows_init
      run: |
        # On the Qualcomm ARM64 runner the GHA service runs as x64 under
        # Prism emulation and every standard arch API reports x64; only
        # PROCESSOR_IDENTIFIER preserves the real CPU string
        # ("ARMv8 (64-bit) ... Qualcomm ..."). Match on that and pull the
        # aarch64 uv release asset directly — astral's install.ps1 would
        # otherwise fetch the x86_64 build.
        $isArm64 = $env:PROCESSOR_IDENTIFIER -match 'ARM|Qualcomm'
        if ($isArm64) {
          $uvZip = Join-Path $env:GITHUB_WORKSPACE "uv-arm64.zip"
          $uvDir = Join-Path $env:GITHUB_WORKSPACE "uv-arm64"
          Invoke-WebRequest -Uri "https://github.com/astral-sh/uv/releases/latest/download/uv-aarch64-pc-windows-msvc.zip" -OutFile $uvZip
          New-Item -ItemType Directory -Force -Path $uvDir | Out-Null
          Expand-Archive -Path $uvZip -DestinationPath $uvDir -Force
          echo "$uvDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        } else {
          irm https://astral.sh/uv/install.ps1 | iex
        }

    - name: Create uv environment (Windows)
      shell: powershell
      if: runner.os == 'Windows'
      run: |
        # `uv python install <ver>` on aarch64 Windows still fetches the
        # x86_64 CPython build (as of uv 0.12.5), producing a win_amd64
        # venv. Use the pythonarm64 nuget package (same source used by
        # build-wheels.yml for cross-compile) as the venv interpreter so
        # the resulting environment is genuinely aarch64.
        $isArm64 = $env:PROCESSOR_IDENTIFIER -match 'ARM|Qualcomm'
        if ($isArm64) {
          $pyZip = Join-Path $env:GITHUB_WORKSPACE "python-arm64.zip"
          $pyDir = Join-Path $env:GITHUB_WORKSPACE "python-arm64"
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/pythonarm64/${{ inputs.VER_PYTHON }}" -OutFile $pyZip
          New-Item -ItemType Directory -Force -Path $pyDir | Out-Null
          Expand-Archive -Path $pyZip -DestinationPath $pyDir -Force
          $pyExe = Join-Path $pyDir "tools\python.exe"
          uv venv --python "$pyExe" "${{ inputs.ENV_NAME }}"
        } else {
          # Force a uv-managed CPython (latest patch release) instead of the
          # runner's system install, which is 3.10.0 for 3.10 -- a patch
          # release whose typing.ForwardRef lacks `is_class` and breaks
          # libraries like pydantic 2.14.0. --native-tls matches the other
          # uv calls on these runners, which need the Windows cert store.
          uv venv --managed-python --native-tls --python "${{ inputs.VER_PYTHON }}" "${{ inputs.ENV_NAME }}"
        }
        .\"${{ inputs.ENV_NAME }}"\Scripts\Activate.ps1
    - name: Install uv (Linux)
      if: runner.os != 'Windows'
      shell: bash
      id: linux_init
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "UV_LINK_MODE=symlink" >> $GITHUB_ENV

    - name: Create uv environment (Linux/macOS)
      shell: bash
      if: runner.os != 'Windows'
      run: |
        uv venv --native-tls --python "${{ inputs.VER_PYTHON }}" "${{ inputs.ENV_NAME }}"
        . "./${{ inputs.ENV_NAME }}/bin/activate"
