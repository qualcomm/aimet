################################################################################
# Composite Action: Stop Ephemeral GPU Runner(s)
################################################################################
# Tears down Argo workflow(s) started by the start-gpu-runner action and
# de-registers any lingering GitHub Actions runners. Accepts a single runner
# ID or a comma-separated list. Empty/blank entries are skipped, so it's safe
# to pass outputs from skipped jobs.
#
# Usage:
#   steps:
#     - uses: actions/checkout@v4
#     - uses: ./.github/actions/stop-gpu-runner
#       with:
#         runner-ids: "runner-1,runner-2"
#         kubeconfig: ${{ secrets.KUBECONFIG }}
#         pat-token: ${{ secrets.SOURCE_REPO_PAT }}
################################################################################

name: Stop GPU Runner
description: Stop ephemeral GPU runner Argo workflow(s) and de-register from GitHub

inputs:
  runner-ids:
    description: 'Runner ID(s) to clean up. Single value or comma-separated list.'
    required: true
  argo-namespace:
    description: 'Argo namespace'
    required: false
    default: "aihub-ci"
  kubeconfig:
    description: 'Kubeconfig file contents for cluster access'
    required: true
  pat-token:
    description: 'GitHub PAT for runner de-registration'
    required: true

runs:
  using: composite
  steps:
    - name: Install Argo CLI
      shell: bash
      run: |
        if ! command -v argo &>/dev/null; then
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 30 \
            "https://github.com/argoproj/argo-workflows/releases/download/v3.5.5/argo-linux-amd64.gz" -o /tmp/argo.gz
          gunzip -f /tmp/argo.gz
          sudo install /tmp/argo /usr/local/bin/argo
          rm /tmp/argo
        fi

    - name: Configure cluster access
      shell: bash
      run: |
        mkdir -p ~/.kube
        echo "$KUBECONFIG_DATA" > ~/.kube/config
        chmod 600 ~/.kube/config
      env:
        KUBECONFIG_DATA: ${{ inputs.kubeconfig }}

    - name: Stop Argo workflows
      shell: bash
      run: |
        IFS=',' read -ra IDS <<< "${{ inputs.runner-ids }}"
        for id in "${IDS[@]}"; do
          id=$(echo "$id" | xargs)  # trim whitespace
          if [ -n "$id" ]; then
            bash scripts/kube/stop_pod.sh "$id" || true
          fi
        done
      env:
        NAMESPACE: ${{ inputs.argo-namespace }}

    - name: De-register runners from GitHub
      shell: bash
      run: |
        IFS=',' read -ra IDS <<< "${{ inputs.runner-ids }}"
        for id in "${IDS[@]}"; do
          id=$(echo "$id" | xargs)
          if [ -z "$id" ]; then
            continue
          fi

          # Find the runner by name
          RUNNER_ID=$(curl -s \
            -H "Authorization: token ${{ inputs.pat-token }}" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/runners?per_page=100" \
            | jq -r --arg name "$id" '.runners[] | select(.name==$name) | .id')

          if [ -n "$RUNNER_ID" ] && [ "$RUNNER_ID" != "null" ]; then
            echo "De-registering runner '$id' (ID: $RUNNER_ID)..."
            curl -s -X DELETE \
              -H "Authorization: token ${{ inputs.pat-token }}" \
              -H "Accept: application/vnd.github+json" \
              "${{ github.api_url }}/repos/${{ github.repository }}/actions/runners/$RUNNER_ID" || true
          else
            echo "Runner '$id' not found on GitHub (already de-registered)"
          fi
        done
        echo "Cleanup complete"
