# not on the enterprise-allowlisted actions list. Every job in this file is
# purely a Slack notifier, so the whole file is short-circuited to a no-op
# workflow until the action is allowlisted or replaced with an allowlisted
# alternative.
name: Notify public Github activity on Slack (disabled)

on:
  workflow_dispatch:  # manual-only; prevents scheduled/pr triggers while disabled

jobs:
  noop:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "disabled"

