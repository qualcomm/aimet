name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop, release-* ]
  workflow_dispatch:

# Cancel in-progress runs exclusively for PR jobs. `github.head_ref` is defined only for PRs,
# for post-merge, it defaults to `github.run_id`, which is guaranteed to be unique.
concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# The internal repo and the public mirror (qualcomm/aimet) both live on
# github.com, so these jobs gate on the owner rather than the host: CI runs
# internally, where the self-hosted runners and secrets exist, and is skipped
# on the public mirror.
jobs:

  dco:
    if: github.repository_owner != 'qualcomm'
    uses: ./.github/workflows/dco.yml

  pre-commit-check:
    name: Lint
    if: github.repository_owner != 'qualcomm'
    needs: dco
    uses: ./.github/workflows/pre-commit.yml

  variants:
    name: Variants
    if: github.repository_owner != 'qualcomm'
    runs-on: tetra-ubuntu-2204
    needs: pre-commit-check
    outputs:
      matrix: ${{ steps.final.outputs.value }}
      test_genai_unit: ${{ steps.select.outputs.test_genai_unit }}
    steps:
      - uses: actions/checkout@v4
      - name: Get changed files
        id: diff
        uses: ./.github/actions/changed-files
      - name: Select AIMET variants that needs testing
        id: select
        env:
          ALL_CHANGED_FILES: ${{ steps.diff.outputs.changed_files }}
          AIMET_TORCH_SRC_CODE:             "TrainingExtensions/torch/"
          AIMET_ONNX_SRC_CODE:              "TrainingExtensions/onnx/"
          DOC_SRC_CODE:                     "Docs/"
          EXAMPLES_SRC_CODE:                "Examples/"
          GENAI_TEST_CODE:                  "GenAILab/"
          ONNXREGRESSION_TEST_CODE:         "AIMETRegression/"
          GIT_HOOKS_SRC_CODE:               ".githooks/"
        shell: bash
        run: |
          set -x

          TORCH_TEST_REQUIRED='false'
          ONNX_TEST_REQUIRED='false'
          GENAI_UNIT_TEST_REQUIRED='false'

          for file in ${ALL_CHANGED_FILES}; do
            if [[ "$file" == "$AIMET_TORCH_SRC_CODE"* ]]; then
              TORCH_TEST_REQUIRED='true'
            elif [[ "$file" == "$AIMET_ONNX_SRC_CODE"* ]]; then
              ONNX_TEST_REQUIRED='true'
            elif [[ "$file" == "$DOC_SRC_CODE"* ]]; then
              : # Documentation change doesn't require running unit tests; only doc rebuild is needed
            elif [[ "$file" == "$EXAMPLES_SRC_CODE"* ]]; then
              : # Examples change doesn't require running unit tests; only doc rebuild is needed
            elif [[ "$file" == "$GENAI_TEST_CODE"* ]]; then
              # GenAI code changes (not config changes) trigger full builds + GenAI unit/integration tests
              if [[ "$file" != "$GENAI_TEST_CODE"configs/*.yaml ]]; then
                GENAI_UNIT_TEST_REQUIRED='true'
                TORCH_TEST_REQUIRED='true'
                ONNX_TEST_REQUIRED='true'
              fi
            elif [[ "$file" == "$ONNXREGRESSION_TEST_CODE"* ]]; then
              : # AIMETRegression tests change doesn't require running unit tests
            elif [[ "$file" == "$GIT_HOOKS_SRC_CODE"* ]]; then
              : # Git hooks change doesn't require running unit tests
            else
              TORCH_TEST_REQUIRED='true'
              ONNX_TEST_REQUIRED='true'
              GENAI_UNIT_TEST_REQUIRED='true'
              break
            fi
          done

          echo "test_torch=$TORCH_TEST_REQUIRED" >> $GITHUB_OUTPUT
          echo "test_onnx=$ONNX_TEST_REQUIRED"   >> $GITHUB_OUTPUT
          echo "test_genai_unit=$GENAI_UNIT_TEST_REQUIRED" >> $GITHUB_OUTPUT
      - name: Torch variants
        # For the default branch, we still test all variants every time (yet)
        if: steps.select.outputs.test_torch == 'true' || github.ref_name == github.event.repository.default_branch
        run: |
          VALUE=$(echo "${VALUE:-"{}"}" | jq -c '.include += [
              {
                 "id":              "torch-cpu-linux-x86",
                 "platform":        "linux",
                 "PACKAGE":         "aimet_torch",
                 "VER_PYTHON_BUILD": "3.12",
                 "VER_PYTHON_TEST":  "3.12",
                 "VER_TORCH":       "2.*",
                 "VER_ONNXRUNTIME": "",
                 "VER_CUDA":        "",
                 "RUN_UNIT_TESTS":    "ON",
                 "RUN_ACCEPTANCE_TESTS":    "OFF",
                 "PIP_INDEX":       ""
              },
              {
                 "id":              "torch-gpu-linux-x86",
                 "platform":        "linux",
                 "PACKAGE":         "aimet_torch",
                 "VER_PYTHON_BUILD": "3.12",
                 "VER_PYTHON_TEST":  "3.12",
                 "VER_TORCH":       "2.*",
                 "VER_ONNXRUNTIME": "",
                 "VER_CUDA":        "13.2.0",
                 "RUN_UNIT_TESTS":    "ON",
                 "RUN_ACCEPTANCE_TESTS":    "OFF",
                 "PIP_INDEX":       ""
              }
            ]')
          echo "VALUE=$VALUE" >> $GITHUB_ENV
      - name: ONNX variants
        # For the default branch, we still test all variants every time (yet)
        if: steps.select.outputs.test_onnx == 'true' || github.ref_name == github.event.repository.default_branch
        run: |
          VALUE=$(echo "${VALUE:-"{}"}" | jq -c '.include += [
              {
                 "id":              "onnx-cpu-linux-x86",
                 "platform":        "linux",
                 "PACKAGE":         "aimet_onnx",
                 "BUILD_CPP_TESTS": "ON",
                 "VER_PYTHON_BUILD": "3.12",
                 "VER_PYTHON_TEST":  "3.12",
                 "VER_TORCH":       "",
                 "VER_ONNXRUNTIME": "1.19.2",
                 "VER_CUDA":        "",
                 "RUN_UNIT_TESTS":    "ON",
                 "RUN_ACCEPTANCE_TESTS":    "OFF",
                 "PIP_INDEX":       ""
              },
              {
                 "id":              "onnx-gpu-linux-x86",
                 "platform":        "linux",
                 "PACKAGE":         "aimet_onnx",
                 "BUILD_CPP_TESTS": "ON",
                 "VER_PYTHON_BUILD": "3.12",
                 "VER_PYTHON_TEST":  "3.12",
                 "VER_TORCH":       "",
                 "VER_ONNXRUNTIME": "1.19.2",
                 "VER_CUDA":        "13.2.0",
                 "RUN_UNIT_TESTS":    "ON",
                 "RUN_ACCEPTANCE_TESTS":    "OFF",
                 "PIP_INDEX":       ""
              }
            ]')
          echo "VALUE=$VALUE" >> $GITHUB_ENV

      - name: Doc variants
        run: |
          VALUE=$(echo "${VALUE:-"{}"}" | jq -c '.include += [
              {
                 "id":              "onnx-torch-cpu-linux-x86",
                 "platform":        "linux",
                 "PACKAGE":         "docs",
                 "VER_PYTHON_BUILD": "3.12",
                 "VER_PYTHON_TEST":  "3.12",
                 "VER_TORCH":       "2.*",
                 "VER_ONNXRUNTIME": "1.19.2",
                 "VER_CUDA":        "",
                 "RUN_UNIT_TESTS":    "OFF",
                 "RUN_ACCEPTANCE_TESTS":    "OFF",
                 "PIP_INDEX":       ""
              }
            ]')
          echo "VALUE=$VALUE" >> $GITHUB_ENV

      - name: (Last step) Generate few extra properties for each variant
        id: final
        run: |
          echo "value=$VALUE" >> $GITHUB_OUTPUT

  call-build-wheels:
    name: Build
    if: github.repository_owner != 'qualcomm'
    needs: [ variants ]
    uses: ./.github/workflows/build-wheels.yml
    with:
      variants: ${{ needs.variants.outputs.matrix }}
    secrets: inherit

  call-run-unit-acceptance-tests:
    name: Test
    if: github.repository_owner != 'qualcomm'
    needs: [ variants, call-build-wheels ]
    uses: ./.github/workflows/run-unit-acceptance-tests.yml
    with:
      variants: ${{ needs.variants.outputs.matrix }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # GenAI unit + integration tests, using freshly built AIMET wheels from the
  # same pipeline run.
  # ---------------------------------------------------------------------------
  genai-unit-tests:
    name: Test (genai)
    needs: [pre-commit-check, variants, call-build-wheels]
    if: >-
      github.repository_owner != 'qualcomm' &&
      (needs.variants.outputs.test_genai_unit == 'true' || github.ref_name == github.event.repository.default_branch)
    # Tests are CPU/fp32, but the integration suite needs more than 64Gi because
    # the module-level ORT session caches are never evicted. mlops-ci-cpu now
    # requests 128Gi, so no GPU class is needed.
    runs-on: mlops-ci-cpu
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download aimet-torch wheel
        uses: actions/download-artifact@v4
        with:
          name: "torch-cpu-linux-x86-wheel"
          path: "downloads"

      - name: Download aimet-onnx wheel
        uses: actions/download-artifact@v4
        with:
          name: "onnx-cpu-linux-x86-wheel"
          path: "downloads"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install downloads/*.whl
          pip install -r GenAILab/requirements.txt
          hf auth login --token ${{ secrets.HUGGINGFACE_TOKEN }}

      - name: Run GenAI unit tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          python -m pytest GenAILab/tests/unit/ -v --tb=short -c pyproject.toml

      - name: Run GenAI integration tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          python -m pytest GenAILab/tests/integration/ -v --tb=short -c pyproject.toml

  # Single required status check for branch protection. Required checks that are skipped count
  # as passing, and jobs are skipped when the jobs they need fail (e.g. tests when a wheel build
  # fails), so this job always runs and fails if any CI job failed, was cancelled, or never ran.
  # Jobs skipped by design (e.g. GenAI tests on unrelated changes) don't fail it.
  # DCO stays a separately required check so its failure is named in the PR merge box.
  ci-gate:
    name: CI gate
    if: always() && github.repository_owner != 'qualcomm'
    needs: [dco, pre-commit-check, variants, call-build-wheels, call-run-unit-acceptance-tests, genai-unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every CI job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          GENAI_REQUIRED: >-
            ${{ needs.variants.outputs.test_genai_unit == 'true' ||
                github.ref_name == github.event.repository.default_branch }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # GenAI tests are skipped by design unless GenAI-affecting files changed
          failed=$(echo "$NEEDS" | jq -r --argjson genai "$GENAI_REQUIRED" '
            to_entries[]
            | select(.value.result != "success")
            | select(.key != "genai-unit-tests" or $genai or .value.result != "skipped")
            | "\(.key) (\(.value.result))"')
          if [ -n "$failed" ]; then
            if [ "$(echo "$NEEDS" | jq -r '.dco.result')" != success ]; then
              echo "::error::CI did not run because the DCO check failed"
            fi
            echo "::error::CI jobs did not succeed: $(echo $failed | tr '\n' ' ')"
            exit 1
          fi
