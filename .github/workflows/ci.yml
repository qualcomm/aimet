name: CI pipeline

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop, release-* ]

# Cancel in-progress runs exclusively for PR jobs. `github.head_ref` is defined only for PRs,
# for post-merge, it defaults to `github.run_id`, which is guaranteed to be unique.
concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# The internal repo and the public mirror (qualcomm/aimet) both live on
# github.com, so these jobs gate on the owner rather than the host: CI runs
# internally, where the self-hosted runners and secrets exist, and is skipped
# on the public mirror.
jobs:

  dco:
    if: github.repository_owner != 'qualcomm'
    uses: ./.github/workflows/dco.yml

  pipeline:
    if: github.repository_owner != 'qualcomm'
    needs: dco
    uses: ./.github/workflows/pipeline.yml
    secrets: inherit

  # Single required status check for branch protection. Required checks that are skipped count
  # as passing, and pipeline jobs are skipped when the jobs they need fail (e.g. "Run unit tests"
  # when a wheel build fails), so this job always runs and fails unless the pipeline succeeded.
  # DCO stays a separately required check so its failure is named in the PR merge box.
  ci-gate:
    name: CI gate
    if: always() && github.repository_owner != 'qualcomm'
    needs: [dco, pipeline]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless the CI pipeline succeeded
        env:
          DCO_RESULT: ${{ needs.dco.result }}
          PIPELINE_RESULT: ${{ needs.pipeline.result }}
        run: |
          echo "dco: $DCO_RESULT, pipeline: $PIPELINE_RESULT"
          if [ "$PIPELINE_RESULT" = success ]; then
            exit 0
          fi
          if [ "$DCO_RESULT" != success ]; then
            echo "::error::CI pipeline did not run because the DCO check failed ($DCO_RESULT)"
          else
            echo "::error::CI pipeline did not succeed ($PIPELINE_RESULT)"
          fi
          exit 1
