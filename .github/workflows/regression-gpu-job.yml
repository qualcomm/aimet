name: Regression GPU Job

# Reusable GPU regression job shared by the nightly and weekly regression
# workflows. Each caller invokes this once per framework (onnx, torch) on an
# ephemeral GPU runner it has already allocated.

on:
  workflow_call:
    inputs:
      framework:
        description: "Framework to run: onnx or torch"
        required: true
        type: string
      runner-id:
        description: "Label of the ephemeral GPU runner to run on"
        required: true
        type: string
      suite:
        description: "Suite name passed to suite_runner (e.g. nightly-onnx)"
        required: true
        type: string
      workflow-file:
        # Must be the caller's workflow file name: download-baseline searches
        # this workflow's run history for the previous baseline artifact.
        description: "Caller workflow file name used to locate baseline artifacts"
        required: true
        type: string
      artifact-prefix:
        description: "Prefix for comparison-summary and report artifact names"
        required: true
        type: string
      enable-aihub:
        description: "Configure AI Hub for on-device QNN jobs"
        required: false
        default: false
        type: boolean
      filter-model:
        description: "Substring filter for model names"
        required: false
        default: ""
        type: string
      filter-test:
        description: "Substring filter for test names"
        required: false
        default: ""
        type: string
      baseline-source:
        description: "Branch to compare the baseline against"
        required: false
        default: "own"
        type: string
      python-version:
        description: "Python version for the uv environment"
        required: false
        default: "3.12"
        type: string
      torch-version:
        description: "Torch version pin"
        required: false
        default: "2.*"
        type: string
      cuda-short:
        description: "Short CUDA tag for the torch index URL"
        required: false
        default: "cu126"
        type: string

jobs:
  regression:
    name: ${{ inputs.framework }} regression
    runs-on: ${{ inputs.runner-id }}

    timeout-minutes: 720

    env:
      PYTHONUNBUFFERED: "1"
      UV_LINK_MODE: "symlink"
      CUDA_VISIBLE_DEVICES: "0"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      PYTHONFAULTHANDLER: "1"
      INPUT_SUITE: ${{ inputs.suite }}
      WORKFLOW_FILE: ${{ inputs.workflow-file }}
      BASELINE_SOURCE: ${{ inputs.baseline-source }}
      VER_PYTHON: ${{ inputs.python-version }}
      VER_TORCH: ${{ inputs.torch-version }}
      VER_CUDA_SHORT: ${{ inputs.cuda-short }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download AIMET wheel
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.framework }}-gpu-wheel
          path: downloads

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libgl1-mesa-glx libglib2.0-0 libsm6 libxext6 \
            libxrender-dev libgomp1 git openssh-client unzip curl jq
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install
          rm -rf /tmp/awscliv2.zip /tmp/aws
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Mint AI Hub Models reader token
        id: aihm-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.READER_APP_ID }}
          private-key: ${{ secrets.READER_APP_PRIVATE_KEY }}
          owner: qcom-ai-hub
          repositories: ai-hub-models-internal

      - name: Clone AI Hub Models source
        env:
          GH_TOKEN: ${{ steps.aihm-token.outputs.token }}
        run: |
          set -euo pipefail
          AIHM_SRC_DIR="${RUNNER_TEMP}/ai-hub-models-internal"
          # A freshly minted app token is intermittently not usable yet; git reports that as "Repository not found".
          for attempt in 1 2 3; do
            if git clone --depth=1 --branch main \
                "https://x-access-token:${GH_TOKEN}@github.com/qcom-ai-hub/ai-hub-models-internal.git" \
                "$AIHM_SRC_DIR"; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::Could not clone ai-hub-models-internal after 3 attempts"
              exit 1
            fi
            rm -rf "$AIHM_SRC_DIR"
            sleep $((attempt * 10))
          done
          echo "AIHM_SRC_DIR=$AIHM_SRC_DIR" >> "$GITHUB_ENV"

      - name: Authenticate AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Pre-cache torch.hub repos (avoid GitHub API rate limit)
        run: |
          HUB_CACHE="${GITHUB_WORKSPACE}/torch_cache/hub"
          mkdir -p "$HUB_CACHE"
          for repo_spec in "milesial/Pytorch-UNet:master" "rwightman/gen-efficientnet-pytorch:master"; do
            repo="${repo_spec%:*}"
            ref="${repo_spec##*:}"
            dir_name="$(echo "$repo" | tr '/' '_')_${ref}"
            target="$HUB_CACHE/$dir_name"
            if [ ! -d "$target" ]; then
              git clone --depth 1 --branch "$ref" "https://github.com/${repo}.git" "$target"
            fi
          done

      - name: Download datasets from S3
        run: |
          BUCKET="${{ vars.AWS_REGRESSION_BUCKET_NAME }}"
          DATASET_ROOT="$HOME/.qaihm/qai-hub-models/datasets"

          CITYSCAPES_DIR="${DATASET_ROOT}/cityscapes/v2/data"
          mkdir -p "$CITYSCAPES_DIR"
          aws s3 cp "s3://${BUCKET}/cityscapes.zip" "${CITYSCAPES_DIR}/cityscapes.zip"
          unzip -q "${CITYSCAPES_DIR}/cityscapes.zip" -d "$CITYSCAPES_DIR"
          rm "${CITYSCAPES_DIR}/cityscapes.zip"

          CARVANA_DIR="${DATASET_ROOT}/carvana/v2/data"
          mkdir -p "$CARVANA_DIR"
          aws s3 cp "s3://${BUCKET}/carvana.zip" "${CARVANA_DIR}/carvana.zip"
          unzip -q "${CARVANA_DIR}/carvana.zip" -d "$CARVANA_DIR"
          rm "${CARVANA_DIR}/carvana.zip"

          NYUV2_DIR="${DATASET_ROOT}/nyuv2/v2"
          mkdir -p "$NYUV2_DIR"
          aws s3 cp "s3://${BUCKET}/nyuv2.zip" "${NYUV2_DIR}/nyuv2.zip"
          unzip -q "${NYUV2_DIR}/nyuv2.zip" -d "$NYUV2_DIR"
          rm "${NYUV2_DIR}/nyuv2.zip"

          IMAGENET_DIR="${DATASET_ROOT}/imagenet/v2"
          mkdir -p "$IMAGENET_DIR"
          aws s3 cp "s3://${BUCKET}/imagenet.zip" "${IMAGENET_DIR}/imagenet.zip"
          unzip -q "${IMAGENET_DIR}/imagenet.zip" -d "$IMAGENET_DIR"
          rm "${IMAGENET_DIR}/imagenet.zip"

      - name: Setup Python environment
        run: |
          set -e
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"

          # uv downloads and manages the requested interpreter itself
          uv venv .venv --python "${{ env.VER_PYTHON }}" --seed
          . .venv/bin/activate

          # Torch is needed by both frameworks (qai-hub-models pulls it for model export).
          # object-detection-metrics is only used by the torch suites' detection models.
          EXTRA_PACKAGES=""
          if [ "${{ inputs.framework }}" = "torch" ]; then
            EXTRA_PACKAGES="object-detection-metrics"
          fi

          # Pin torch before qai-hub-models; otherwise qai-hub-models pulls a torch version incompatible with the pod's CUDA driver.
          # --extra-index-url is required on every subsequent install so uv cannot re-resolve torch onto a CUDA-13 wheel from plain PyPI.
          # --index-strategy unsafe-best-match lets uv pick the newest compatible version across both indexes (so packaging isn't capped at the cu126-index version).
          # Numpy version is capped to <2 to avoid ml_dtypes segfault with numpy 2.x
          # qai-hub (used directly for on-device QNN jobs) is intentionally not listed: qai-hub-models pulls it in transitively and caps its version. Listing it would let uv lock a newer qai-hub first and downgrade qai-hub-models.
          # huggingface-hub is capped <1.0 (top-level, before qai-hub-models resolves): per-model extras later pull transformers==4.56.2, which requires hf-hub<1.0 but calls .head(allow_redirects=...) — a requests-only kwarg that raises TypeError under hf-hub 1.x's httpx session. uv won't downgrade an already-installed 1.x when the extra is added incrementally, so it must be capped here.
          uv pip install \
            --extra-index-url https://download.pytorch.org/whl/${{ env.VER_CUDA_SHORT }} \
            --index-strategy unsafe-best-match \
            downloads/*.whl \
            "huggingface-hub<1.0" \
            "numpy<2" \
            $EXTRA_PACKAGES \
            pynvml \
            pytest \
            qai-hub-models \
            requests \
            torch==${{ env.VER_TORCH }} \
            torchvision

          if [ "${{ inputs.framework }}" = "onnx" ]; then
            # Reinstall last so onnxruntime-gpu's __init__.py wins over plain onnxruntime (transitive of qai-hub-models).
            # Off 1.19.2: its cudnn_conv_algo_search=EXHAUSTIVE default is non-deterministic across sessions. Capped at <=1.26.0 since >=1.27 needs CUDA 13.
            uv pip install --reinstall --no-deps "onnxruntime-gpu<=1.26.0"
          fi

          uv pip install mmpose --no-deps --extra-index-url https://download.pytorch.org/whl/${{ env.VER_CUDA_SHORT }} --index-strategy unsafe-best-match  # Required by hrnet_pose (not in qai-hub-models extras)

          # Pre-install each regression model's per-model extras so the suite run
          # doesn't pay the install cost (or fail on a network blip) mid-test.
          # Keep the pinned indexes exported so qai-hub-models' own pip calls
          # cannot re-resolve torch onto an incompatible CUDA wheel.
          export PIP_EXTRA_INDEX_URL="https://download.pytorch.org/whl/${{ env.VER_CUDA_SHORT }}"
          export UV_EXTRA_INDEX_URL="$PIP_EXTRA_INDEX_URL"
          export UV_INDEX_STRATEGY="unsafe-best-match"

          install_failures=""
          for config in AIMETRegression/configs/models/*.yaml; do
            model_name="$(sed -n 's/^model_name:[[:space:]]*//p' "$config" | head -1)"
            if [ -z "$model_name" ]; then
              echo "::warning::No model_name in $config, skipping"
              continue
            fi
            echo "::group::qai-hub-models install $model_name"
            if ! qai-hub-models install "$model_name" --yes; then
              echo "::warning::qai-hub-models install $model_name failed"
              install_failures="$install_failures $model_name"
            fi
            echo "::endgroup::"
          done
          if [ -n "$install_failures" ]; then
            echo "::warning::Model installs failed for:$install_failures"
          fi

          # qai-hub-models' PyPI wheel excludes the `scripts` subpackage (dev-only),
          # so run the script straight out of the cloned source instead; it imports
          # everything else from the pip-installed package normally.
          python "$AIHM_SRC_DIR/src/qai_hub_models/scripts/setup_external_repos.py" --all

          python -c "import aimet_${{ inputs.framework }} as aimet; print('AIMET version:', aimet.__version__)"

      - name: Verify ONNX Runtime GPU
        if: ${{ inputs.framework == 'onnx' }}
        run: |
          . .venv/bin/activate
          python -c "
          import onnxruntime as ort
          providers = ort.get_available_providers()
          print('ONNX Runtime providers:', providers)
          assert 'CUDAExecutionProvider' in providers
          "

      - name: Verify PyTorch GPU
        if: ${{ inputs.framework == 'torch' }}
        run: |
          . .venv/bin/activate
          python -c "
          import torch
          print('PyTorch version:', torch.__version__)
          print('CUDA available:', torch.cuda.is_available())
          if torch.cuda.is_available():
              print('CUDA device:', torch.cuda.get_device_name(0))
          assert torch.cuda.is_available(), 'CUDA not available!'
          "

      - name: Configure AI Hub
        if: ${{ inputs.enable-aihub }}
        env:
          QAI_HUB_API_TOKEN: ${{ secrets.AIMET_BOT_AIHUB_DEV_TOKEN }}
        run: |
          . .venv/bin/activate
          python -m AIMETRegression.workflow.utils configure-aihub

      - name: Download baseline
        id: download_baseline
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . .venv/bin/activate
          python -m AIMETRegression.workflow.artifacts download-baseline \
            --output-dir AIMETRegression/baselines/downloaded

      - name: Run test suite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Authenticate to HuggingFace so model-weight downloads aren't subject
          # to the low anonymous rate limit, which intermittently 429s and marks
          # timm/transformers-backed models (mobile_vit, sequencer2d, ...) as
          # "not run". huggingface_hub reads HF_TOKEN with priority.
          HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          . .venv/bin/activate
          python -m AIMETRegression.suite_runner \
            --suite "$INPUT_SUITE" \
            --filter-model "${{ inputs.filter-model }}" \
            --filter-test "${{ inputs.filter-test }}"

      - name: Compare with baseline
        run: |
          . .venv/bin/activate

          RESULTS_CSV="AIMETRegression/reports/results_${INPUT_SUITE}.csv"

          if [ ! -f "$RESULTS_CSV" ]; then
            echo "Results CSV not found: $RESULTS_CSV"
            exit 1
          fi

          python AIMETRegression/baseline_comparison.py run \
            --results "$RESULTS_CSV" \
            --suite-name "$INPUT_SUITE" \
            --baselines-dir "AIMETRegression/baselines" \
            --prior-baseline "AIMETRegression/baselines/downloaded/latest.json" \
            --baseline-source "${{ steps.download_baseline.outputs.source_branch || env.BASELINE_SOURCE }}" \
            --run-id "${{ github.run_id }}" \
            --baseline-date "$(date -u '+%Y-%m-%d')" \
            --github-summary \
            --output-file "AIMETRegression/reports/comparison_summary.json"

      - name: Generate lockfile
        if: always()
        run: |
          . .venv/bin/activate
          export PATH="$HOME/.local/bin:$PATH"
          python -m AIMETRegression.workflow.utils generate-lockfile \
            --run-id "${{ github.run_id }}"

      - name: Generate timestamp
        if: always()
        id: timestamp
        run: |
          echo "datetime=$(date '+%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Generate artifact name
        id: artifact_name
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . .venv/bin/activate
          ARTIFACT_NAME=$(python -c "
          from AIMETRegression.workflow.artifacts import ArtifactManager, WorkflowConfig
          config = WorkflowConfig.from_env()
          manager = ArtifactManager(config)
          print(manager.get_artifact_name('${{ github.ref_name }}', '$INPUT_SUITE'))
          ")
          echo "name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT

      - name: Upload baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: AIMETRegression/baselines/latest.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload comparison summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}-comparison-summary
          path: AIMETRegression/reports/comparison_summary.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}-reports-${{ steps.timestamp.outputs.datetime }}-${{ github.run_id }}
          path: AIMETRegression/reports/**/*
          retention-days: 30

      - name: Check for failures
        if: always()
        run: |
          SUMMARY=AIMETRegression/reports/comparison_summary.json
          if [ ! -f "$SUMMARY" ]; then
            echo "::error::No comparison_summary.json produced — suite or baseline comparison crashed"
            exit 1
          fi
          if [ "$(jq -r '.has_failures // false' "$SUMMARY")" = "true" ]; then
            echo "::error::Per-test failures detected"
            jq '{crashed_tests, failed_tests, regression_tests}' "$SUMMARY"
            exit 1
          fi
          echo "All tests passed"
