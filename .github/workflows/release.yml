name: Release AIMET

on:
  push:
    branches:
      - "dev/bhushans/release_gh"

  workflow_dispatch:
    inputs:
      version:
        description: "AIMET version to release"
        required: true
        type: string
      push_to_pypi:
        description: "Push to pypi if true"
        # required: true
        type: boolean
        default: false
      push_docs:
        description: "Puts up PR on aimet-pages"
        # required: true
        type: boolean
        default: false

env:
  # RELEASE_BRANCH: "release-aimet-"{{ inputs.version }}
  # INTERNAL_SRC_BRANCH: "develop"
  RELEASE_BRANCH: "dev/bhushans/release_gh"

jobs:
  # checklist:
  #   name: Validate version and release branch exists
  #   runs-on: ubuntu-latest

  build_wheels_and_test:
    name: Run nightly to build wheels and test basic tests
    uses: ./.github/workflows/nightly-pipeline.yml
    secrets: inherit
    # TODO: pass release internal branch to build wheels for

  push_release_branch_to_public:
    name: Create public release branch
    uses: ./.github/workflows/repo-sync.yml
    with:
      src_branch: "dev/bhushans/release_gh"
      dst_branch: "dev/bhushans/release_gh"
    secrets: inherit
