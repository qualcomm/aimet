name: Build wheels

# One matrixed job across every platform. Each variant entry carries its own
# "platform" ("linux" | "windows" | "macos") and, for windows, "arch"
# ("x64" | "arm64"); runs-on and the per-platform build steps are derived
# from those fields below instead of three separate platform-specific jobs.

on:
  workflow_call:
    inputs:
      variants:
        required: true
        type: string

jobs:
  build:
    name: ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.variants) }}
    # Linux builds (CPU or GPU) stay on mlops-ci-cpu; Windows cross-compiles
    # both arches from the amd64 runner; macOS builds natively on arm64.
    runs-on: >-
      ${{
        matrix.platform == 'windows' && 'aimet-windows-amd64' ||
        matrix.platform == 'macos' && 'aimet-mac-arm64' ||
        'mlops-ci-cpu'
      }}
    env:
      VER_PYTHON: ${{ matrix.VER_PYTHON_BUILD || matrix.VER_PYTHON || '3.12' }}
      GPU_FLAG: ${{ matrix.platform == 'linux' && matrix.VER_CUDA != '' && '--gpu' || '' }}
      ENABLE_TESTS_FLAG: ${{ matrix.BUILD_CPP_TESTS == 'ON' && '--enable-tests' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: "Build AIMET (${{ matrix.id }})"
        uses: ./.github/actions/build
        with:
          id: ${{ matrix.id }}
          platform: ${{ matrix.platform }}
          package: ${{ matrix.PACKAGE }}
          ver-python: ${{ env.VER_PYTHON }}
          ver-torch: ${{ matrix.VER_TORCH }}
          ver-onnxruntime: ${{ matrix.VER_ONNXRUNTIME }}
          pip-index: ${{ matrix.PIP_INDEX }}
          gpu-flag: ${{ env.GPU_FLAG }}
          enable-tests-flag: ${{ env.ENABLE_TESTS_FLAG }}
          arch: ${{ matrix.arch }}
          windows-vcpkg-triplet: ${{ matrix.windows_vcpkg_triplet }}
          macos-deployment-target: ${{ matrix.macos_deployment_target }}

      - name: Upload AIMET wheel file
        if: matrix.PACKAGE != 'docs'
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.id }}-wheel"
          path: wheelhouse/aimet*.whl
          if-no-files-found: error
          retention-days: 30

      - name: Upload compiled C++ unit tests
        if: matrix.BUILD_CPP_TESTS == 'ON'
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.id }}-tests"
          path: build/**/MoDl*Test
          if-no-files-found: error
          retention-days: 1

      - name: Upload AIMET documentation
        if: matrix.PACKAGE == 'docs'
        uses: actions/upload-artifact@v4
        with:
          name: Docs
          path: wheelhouse/Docs/
          if-no-files-found: error
          retention-days: 30
