name: CI Pipeline

on:
  workflow_call:
  workflow_dispatch:

jobs:
  pre-commit-check:
    name: "Pre-commit check"
    uses: ./.github/workflows/pre-commit.yml

  variants:
    name: Define supported AIMET variants
    runs-on: tetra-ubuntu-2204
    needs: pre-commit-check
    outputs:
      matrix: ${{ steps.final.outputs.value }}
      test_genai_unit: ${{ steps.select.outputs.test_genai_unit }}
    steps:
      - uses: actions/checkout@v4
      - name: Get changed files
        id: diff
        uses: ./.github/actions/changed-files
      - name: Select AIMET variants that needs testing
        id: select
        env:
          ALL_CHANGED_FILES: ${{ steps.diff.outputs.changed_files }}
          AIMET_TORCH_SRC_CODE:             "TrainingExtensions/torch/"
          AIMET_ONNX_SRC_CODE:              "TrainingExtensions/onnx/"
          DOC_SRC_CODE:                     "Docs/"
          EXAMPLES_SRC_CODE:                "Examples/"
          GENAI_TEST_CODE:                  "GenAILab/"
          ONNXREGRESSION_TEST_CODE:         "AIMETRegression/"
          GIT_HOOKS_SRC_CODE:               ".githooks/"
        shell: bash
        run: |
          set -x

          TORCH_TEST_REQUIRED='false'
          ONNX_TEST_REQUIRED='false'
          GENAI_UNIT_TEST_REQUIRED='false'

          for file in ${ALL_CHANGED_FILES}; do
            if [[ "$file" == "$AIMET_TORCH_SRC_CODE"* ]]; then
              TORCH_TEST_REQUIRED='true'
            elif [[ "$file" == "$AIMET_ONNX_SRC_CODE"* ]]; then
              ONNX_TEST_REQUIRED='true'
            elif [[ "$file" == "$DOC_SRC_CODE"* ]]; then
              : # Documentation change doesn't require running unit tests; only doc rebuild is needed
            elif [[ "$file" == "$EXAMPLES_SRC_CODE"* ]]; then
              : # Examples change doesn't require running unit tests; only doc rebuild is needed
            elif [[ "$file" == "$GENAI_TEST_CODE"* ]]; then
              # GenAI code changes (not config changes) trigger full builds + GenAI unit/integration tests
              if [[ "$file" != "$GENAI_TEST_CODE"configs/*.yaml ]]; then
                GENAI_UNIT_TEST_REQUIRED='true'
                TORCH_TEST_REQUIRED='true'
                ONNX_TEST_REQUIRED='true'
              fi
            elif [[ "$file" == "$ONNXREGRESSION_TEST_CODE"* ]]; then
              : # AIMETRegression tests change doesn't require running unit tests
            elif [[ "$file" == "$GIT_HOOKS_SRC_CODE"* ]]; then
              : # Git hooks change doesn't require running unit tests
            else
              TORCH_TEST_REQUIRED='true'
              ONNX_TEST_REQUIRED='true'
              GENAI_UNIT_TEST_REQUIRED='true'
              break
            fi
          done

          echo "test_torch=$TORCH_TEST_REQUIRED" >> $GITHUB_OUTPUT
          echo "test_onnx=$ONNX_TEST_REQUIRED"   >> $GITHUB_OUTPUT
          echo "test_genai_unit=$GENAI_UNIT_TEST_REQUIRED" >> $GITHUB_OUTPUT
      - name: Torch variants
        # For the default branch, we still test all variants every time (yet)
        if: steps.select.outputs.test_torch == 'true' || github.ref_name == github.event.repository.default_branch
        run: |
          VALUE=$(echo "${VALUE:-"{}"}" | jq -c '.include += [
              {
                 "id":              "torch-cpu",
                 "VER_PYTHON_BUILD": "3.12",
                 "VER_PYTHON_TEST":  "3.12",
                 "VER_TORCH":       "2.*",
                 "VER_ONNXRUNTIME": "",
                 "VER_CUDA":        "",
                 "RUN_UNIT_TESTS":    "ON",
                 "RUN_ACCEPTANCE_TESTS":    "OFF",
                 "BUILD_TARGETS":   "all",
                 "PIP_INDEX":       ""
              },
              {
                 "id":              "torch-gpu",
                 "VER_PYTHON_BUILD": "3.12",
                 "VER_PYTHON_TEST":  "3.12",
                 "VER_TORCH":       "2.*",
                 "VER_ONNXRUNTIME": "",
                 "VER_CUDA":        "12.6.3",
                 "RUN_UNIT_TESTS":    "ON",
                 "RUN_ACCEPTANCE_TESTS":    "OFF",
                 "BUILD_TARGETS":   "all",
                 "PIP_INDEX":       ""
              }
            ]')
          echo "VALUE=$VALUE" >> $GITHUB_ENV
      - name: ONNX variants
        # For the default branch, we still test all variants every time (yet)
        if: steps.select.outputs.test_onnx == 'true' || github.ref_name == github.event.repository.default_branch
        run: |
          VALUE=$(echo "${VALUE:-"{}"}" | jq -c '.include += [
              {
                 "id":              "onnx-cpu",
                 "VER_PYTHON_BUILD": "3.12",
                 "VER_PYTHON_TEST":  "3.12",
                 "VER_TORCH":       "",
                 "VER_ONNXRUNTIME": "1.19.2",
                 "VER_CUDA":        "",
                 "RUN_UNIT_TESTS":    "ON",
                 "RUN_ACCEPTANCE_TESTS":    "OFF",
                 "BUILD_TARGETS":   "all",
                 "PIP_INDEX":       ""
              },
              {
                 "id":              "onnx-gpu",
                 "VER_PYTHON_BUILD": "3.12",
                 "VER_PYTHON_TEST":  "3.12",
                 "VER_TORCH":       "",
                 "VER_ONNXRUNTIME": "1.19.2",
                 "VER_CUDA":        "12.6.3",
                 "RUN_UNIT_TESTS":    "ON",
                 "RUN_ACCEPTANCE_TESTS":    "OFF",
                 "BUILD_TARGETS":   "all",
                 "PIP_INDEX":       ""
              }
            ]')
          echo "VALUE=$VALUE" >> $GITHUB_ENV

      - name: Doc variants
        run: |
          VALUE=$(echo "${VALUE:-"{}"}" | jq -c '.include += [
              {
                 "id":              "onnx-torch-cpu",
                 "VER_PYTHON_BUILD": "3.12",
                 "VER_PYTHON_TEST":  "3.12",
                 "VER_TORCH":       "2.*",
                 "VER_ONNXRUNTIME": "1.19.2",
                 "VER_CUDA":        "",
                 "RUN_UNIT_TESTS":    "OFF",
                 "RUN_ACCEPTANCE_TESTS":    "OFF",
                 "BUILD_TARGETS":   "all;doc",
                 "PIP_INDEX":       ""
              }
            ]')
          echo "VALUE=$VALUE" >> $GITHUB_ENV

      - name: (Last step) Generate few extra properties for each variant
        id: final
        run: |
          echo "value=$VALUE" >> $GITHUB_OUTPUT

  call-build-wheels:
    name: Call build-wheels
    needs: [ variants ]
    uses: ./.github/workflows/build-wheels.yml
    with:
      variants: ${{ needs.variants.outputs.matrix }}
      build-windows-wheel: false
      build-macos-wheel: false
    secrets: inherit

  call-run-unit-acceptance-tests:
    name: Run unit tests
    needs: [ variants, call-build-wheels ]
    uses: ./.github/workflows/run-unit-acceptance-tests.yml
    strategy:
      matrix: ${{ fromJSON(needs.variants.outputs.matrix) }}
    with:
      ver_python: ${{ matrix.VER_PYTHON_TEST }}
      ver_cuda: ${{ matrix.VER_CUDA }}
      ver_torch: ${{ matrix.VER_TORCH }}
      ver_onnxruntime: ${{ matrix.VER_ONNXRUNTIME }}
      env_name: ${{ matrix.id }}
      run_unit_tests: ${{ matrix.RUN_UNIT_TESTS == 'ON' }}
      run_acceptance_tests: ${{ matrix.RUN_ACCEPTANCE_TESTS == 'ON' }}
      pip_index: ${{ matrix.PIP_INDEX }}
      include_windows_tests: false
      include_macos_tests: false

    secrets: inherit

  # ---------------------------------------------------------------------------
  # GenAI unit + integration tests, using freshly built AIMET wheels from the
  # same pipeline run.
  # ---------------------------------------------------------------------------
  genai-unit-tests:
    name: GenAI unit tests
    needs: [pre-commit-check, variants, call-build-wheels]
    if: needs.variants.outputs.test_genai_unit == 'true' || github.ref_name == github.event.repository.default_branch
    # Tests are CPU/fp32, but the integration suite needs more than 64Gi because
    # the module-level ORT session caches are never evicted. mlops-ci-cpu now
    # requests 128Gi, so no GPU class is needed.
    runs-on: mlops-ci-cpu
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download aimet-torch wheel
        uses: actions/download-artifact@v4
        with:
          name: "torch-cpu-wheel"
          path: "downloads"

      - name: Download aimet-onnx wheel
        uses: actions/download-artifact@v4
        with:
          name: "onnx-cpu-wheel"
          path: "downloads"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install downloads/*.whl
          pip install -r GenAILab/requirements.txt
          hf auth login --token ${{ secrets.HUGGINGFACE_TOKEN }}

      - name: Run GenAI unit tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          python -m pytest GenAILab/tests/unit/ -v --tb=short -c pyproject.toml

      - name: Run GenAI integration tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          python -m pytest GenAILab/tests/integration/ -v --tb=short -c pyproject.toml
