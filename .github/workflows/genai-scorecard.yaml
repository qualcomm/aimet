################################################################################
# GenAI Scorecard
################################################################################
# Tests AIMET quantization techniques on GenAI models in both Torch and ONNX.
#
# Two testing modes:
# 1. Regression: Run all regression tests
# 2. Ad-hoc: Run a user-provided config file
#
# Torch and ONNX tests run independently — neither waits for the other's
# runner or build to finish. This avoids idle GPU time when the cluster is
# saturated and only one runner is available.
#
# Workflow:
# - Builds AIMET-ONNX, AIMET-Torch from source
# - Starts independent ephemeral GPU runners
# - Runs tests via the genai-test composite action
# - Uploads CSV/JSON reports and model artifacts to S3
################################################################################

name: GenAI Scorecard

on:
  schedule:
    - cron: '0 9 * * *'   # Nightly at 2AM PT (09:00 UTC)
    - cron: '0 1 * * 6'   # Weekly — Friday at 6PM PT (Saturday 01:00 UTC)

  push:
    branches: [ develop ] # Runs for all commits post-merge

  pull_request:
    branches: [ develop, release-* ]
    paths:
      - 'GenAILab/**' # Only run on pull requests that modify files in the GenAILab directory

  workflow_dispatch:
    inputs:
      run_mode:
        description: 'What to run?'
        required: true
        type: choice
        options:
          - regression
          - ad_hoc
        default: 'regression'
      cadence:
        description: 'Override cadence (nightly|weekly|acceptance). Blank = auto from schedule/event.'
        required: false
        type: string
        default: ''
      ad_hoc_config_b64:
        description: 'Base64-encoded config (ad-hoc only). Generate via: cat config.yaml | base64 -w 0'
        required: false
      ad_hoc_variants:
        description: 'Variants to test (ad-hoc only)'
        required: false
        type: choice
        options:
          - both
          - torch
          - onnx
        default: 'both'

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('genai-pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

################################################################################
# Cadence resolution
# - cadence input (if set)    → that value (overrides everything below)
# - schedule cron '0 9 * * *' → nightly
# - schedule cron '0 1 * * 6' → weekly
# - push / workflow_dispatch  → acceptance
################################################################################
env:
  CADENCE: >-
    ${{
      github.event.inputs.cadence != '' && github.event.inputs.cadence ||
      github.event.schedule == '0 9 * * *' && 'nightly' ||
      github.event.schedule == '0 1 * * 6' && 'weekly' ||
      'acceptance'
    }}

################################################################################
# JOBS
################################################################################
jobs:
  # ===========================================================================
  # Build wheels
  # ===========================================================================
  build-aimet-onnx-gpu:
    name: Build aimet_onnx
    if: github.server_url != 'https://github.com'
    uses: ./.github/workflows/build-wheels.yml
    with:
      variants: >
        {"include":[{
          "id":"onnx-gpu",
          "VER_PYTHON":"3.10",
          "VER_ONNXRUNTIME":"1.19.2",
          "VER_CUDA":"12.6.3",
          "ENABLE_TESTS":"OFF",
          "PIP_INDEX":""
        }]}
    secrets: inherit

  build-aimet-torch-gpu:
    name: Build aimet_torch
    if: |
      github.server_url != 'https://github.com' &&
      (github.event_name != 'workflow_dispatch' ||
      github.event.inputs.run_mode != 'ad_hoc' ||
      github.event.inputs.ad_hoc_variants != 'onnx')
    uses: ./.github/workflows/build-wheels.yml
    with:
      variants: >
        {"include":[{
          "id":"torch-gpu",
          "VER_PYTHON":"3.10",
          "VER_TORCH":"2.*",
          "VER_ONNXRUNTIME": "",
          "VER_CUDA": "12.6.3",
          "ENABLE_TESTS":"OFF",
          "PIP_INDEX":""
        }]}
    secrets: inherit

  # ===========================================================================
  # Start ephemeral runners (independent)
  # ===========================================================================
  start-runner-onnx:
    name: Start ONNX runner
    if: |
      always() &&
      github.server_url != 'https://github.com' &&
      (github.event_name != 'workflow_dispatch' ||
      github.event.inputs.run_mode != 'ad_hoc' ||
      github.event.inputs.ad_hoc_variants != 'torch')
    runs-on: ubuntu-latest
    outputs:
      runner-label: ${{ steps.start.outputs.runner-label }}
    steps:
      - uses: actions/checkout@v4
      - id: start
        uses: ./.github/actions/start-gpu-runner
        with:
          runner-id: genai-onnx-${{ github.run_id }}-${{ github.run_attempt }}
          gpu-request: "1"
          cpu-request: "64"
          memory-request: "512Gi"
          argo-namespace: "aihub"
          kubeconfig: ${{ secrets.KUBECONFIG }}
          pat-token: ${{ secrets.SOURCE_REPO_PAT }}

  start-runner-torch:
    name: Start Torch runner
    if: |
      always() &&
      github.server_url != 'https://github.com' &&
      (github.event_name != 'workflow_dispatch' ||
      github.event.inputs.run_mode != 'ad_hoc' ||
      github.event.inputs.ad_hoc_variants != 'onnx')
    runs-on: ubuntu-latest
    outputs:
      runner-label: ${{ steps.start.outputs.runner-label }}
    steps:
      - uses: actions/checkout@v4
      - id: start
        uses: ./.github/actions/start-gpu-runner
        with:
          runner-id: genai-torch-${{ github.run_id }}-${{ github.run_attempt }}
          gpu-request: "1"
          cpu-request: "32"
          memory-request: "512Gi"
          argo-namespace: "aihub"
          kubeconfig: ${{ secrets.KUBECONFIG }}
          pat-token: ${{ secrets.SOURCE_REPO_PAT }}

  # ===========================================================================
  # Run tests (independent — torch doesn't wait for ONNX or vice versa)
  # ===========================================================================
  test-torch:
    name: Test (torch)
    needs: [build-aimet-torch-gpu, build-aimet-onnx-gpu, start-runner-torch]
    if: |
      !cancelled() &&
      github.server_url != 'https://github.com' &&
      needs.build-aimet-torch-gpu.result == 'success' &&
      needs.build-aimet-onnx-gpu.result == 'success' &&
      needs.start-runner-torch.result == 'success'
    runs-on: ${{ needs.start-runner-torch.outputs.runner-label }}
    timeout-minutes: 10080     # 7 days
    steps:
      - uses: actions/checkout@v4
      - name: Resolve config
        id: config
        run: |
          bash scripts/all/resolve_genai_config.sh torch "${{ env.CADENCE }}" \
            "${{ github.event.inputs.ad_hoc_config_b64 }}"
      - uses: ./.github/actions/genai-test
        with:
          variant: torch
          config: ${{ steps.config.outputs.path }}
          wheel-artifacts: torch-gpu-wheel, onnx-gpu-wheel
          huggingface-token: ${{ secrets.HUGGINGFACE_TOKEN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          aws-bucket-name: ${{ secrets.AWS_BUCKET_NAME }}

  test-onnx:
    name: Test (onnx)
    needs: [build-aimet-onnx-gpu, start-runner-onnx]
    if: |
      !cancelled() &&
      github.server_url != 'https://github.com' &&
      needs.build-aimet-onnx-gpu.result == 'success' &&
      needs.start-runner-onnx.result == 'success'
    runs-on: ${{ needs.start-runner-onnx.outputs.runner-label }}
    timeout-minutes: 10080     # 7 days
    steps:
      - uses: actions/checkout@v4
      - name: Resolve config
        id: config
        run: |
          bash scripts/all/resolve_genai_config.sh onnx "${{ env.CADENCE }}" \
            "${{ github.event.inputs.ad_hoc_config_b64 }}"
      - uses: ./.github/actions/genai-test
        with:
          variant: onnx
          config: ${{ steps.config.outputs.path }}
          wheel-artifacts: onnx-gpu-wheel
          huggingface-token: ${{ secrets.HUGGINGFACE_TOKEN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          aws-bucket-name: ${{ secrets.AWS_BUCKET_NAME }}

  # ===========================================================================
  # Cleanup ephemeral runners
  # ===========================================================================
  cleanup-runners:
    name: Cleanup runners
    needs: [test-torch, test-onnx, start-runner-torch, start-runner-onnx]
    if: always() && github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/stop-gpu-runner
        with:
          runner-ids: >-
            ${{ needs.start-runner-torch.outputs.runner-label }},
            ${{ needs.start-runner-onnx.outputs.runner-label }}
          argo-namespace: "aihub"
          kubeconfig: ${{ secrets.KUBECONFIG }}
          pat-token: ${{ secrets.SOURCE_REPO_PAT }}
