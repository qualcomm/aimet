name: Release to AIMET public (callable workflow)

on:

  workflow_call:
    inputs:
      version:
        description: "AIMET version to release"
        required: true
        type: string
      push_to_pypi:
        description: "Push to pypi if true"
        required: false
        type: boolean
        default: false
      push_to_github:
        description: "Push to github (code & release)"
        required: false
        type: boolean
        default: false
      push_docs:
        description: "Puts up a PR on aimet-pages"
        required: false
        type: boolean
        default: false
      run_weekly:
        description: "Dispatch weekly-regression"
        required: false
        type: boolean
        default: false
      run_genai:
        description: "Dispatch genai-scorecard"
        required: false
        type: boolean
        default: false

env:
  PUBLIC_REPO: "qualcomm/aimet"
  REPO_DIR: "aimet-repo"
  DOCS_REPO: "qualcomm/aimet-pages"
  DOCS_REPO_DIR: "aimet-pages-repo"

jobs:
  checklist:
    name: Validate release version
    if: ${{  github.repository_owner != 'qualcomm' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate if input version follows semantic versioning
        run: |
          echo Target release branch: ${{ inputs.version }}
          input_version=`echo ${{ inputs.version }} | grep -o '\.' | wc -l`
          if [[ ${input_version} != 2 ]]; then
              echo "Unsupported version format. Got ${{ inputs.version }}, expecting semantic versioning i.e. <major>.<minor>.<patch>"
              echo "Refer to https://semver.org/"
              exit 1
          fi
      - name: Checkout internal repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          path: ${{ env.REPO_DIR }}
          fetch-depth: 0
      - name: Validate if release branch has same version as input version
        run: |
          repo_version=`cat ${{ env.REPO_DIR }}/packaging/version.txt`
          if [[ ${{ inputs.version }} != ${repo_version} ]]; then
            echo "input release version(${{ inputs.version }}) does not match ${{ github.ref_name }} package version(${repo_version})."
            echo "Please update release version in <aimet_repo>/packaging/version.txt"
            exit 1
          fi

  build_wheels_and_test:
    needs: checklist
    name: Run nightly to build wheels and test basic tests
    secrets: inherit
    uses: ./.github/workflows/nightly-pipeline.yml
    with:
      ref_name: ${{ github.ref_name }}

  trigger_weekly_regression:
    if: ${{ inputs.run_weekly }}
    name: Trigger weekly regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'weekly-regression.yaml',
              ref: context.ref,
            });

  trigger_genai_scorecard:
    if: ${{ inputs.run_genai }}
    name: Trigger GenAI scorecard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'genai-scorecard.yaml',
              ref: context.ref,
              inputs: { cadence: 'weekly' },
            });

  release_aimet_onnx_to_pypi:
    if: inputs.push_to_pypi
    name: "Push AIMET ONNX wheels to PyPI"
    needs: build_wheels_and_test
    uses: ./.github/workflows/pypi-release-pipeline.yml
    with:
      # build_wheels_and_test already produced and tested this exact wheel.
      variant-id: onnx-gpu
      deploy: true
    secrets: inherit

  release_aimet_torch_to_pypi:
    if: inputs.push_to_pypi
    name: "Push AIMET torch wheels to PyPI"
    needs: build_wheels_and_test
    uses: ./.github/workflows/pypi-release-pipeline.yml
    with:
      # build_wheels_and_test already produced and tested this exact wheel.
      variant-id: torch-gpu
      deploy: true
    secrets: inherit

  release_aimet_onnx_macos_to_pypi:
    if: inputs.push_to_pypi
    name: "Push AIMET ONNX macOS wheel to PyPI"
    needs: build_wheels_and_test
    uses: ./.github/workflows/pypi-release-pipeline.yml
    with:
      # build_wheels_and_test already produced and tested this exact wheel.
      variant-id: onnx-cpu-macos-arm64
      deploy: true
    secrets: inherit

  release_aimet_onnx_windows_x64_to_pypi:
    if: inputs.push_to_pypi
    name: "Push AIMET ONNX Windows x64 wheel to PyPI"
    needs: build_wheels_and_test
    uses: ./.github/workflows/pypi-release-pipeline.yml
    with:
      # build_wheels_and_test already produced and tested this exact wheel.
      variant-id: onnx-cpu-win-x64
      deploy: true
    secrets: inherit

  release_aimet_onnx_windows_arm64_to_pypi:
    if: inputs.push_to_pypi
    name: "Push AIMET ONNX Windows ARM64 wheel to PyPI"
    needs: build_wheels_and_test
    uses: ./.github/workflows/pypi-release-pipeline.yml
    with:
      # build_wheels_and_test already produced and tested this exact wheel.
      variant-id: onnx-cpu-win-arm64
      deploy: true
    secrets: inherit

  release_to_github:
    if: inputs.push_to_github || inputs.push_docs
    name: "Release AIMET on Github"
    runs-on: ubuntu-latest
    needs: build_wheels_and_test
    # Requires approval to publish wheels to PyPI from aimet-deployers
    environment: prod
    steps:
      - name: Checkout internal repo
        if: inputs.push_to_github
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          path: ${{ env.REPO_DIR }}
          fetch-depth: 0
          # Otherwise the persisted GITHUB_TOKEN overrides the PAT in the
          # public-origin URL below and the push fails as github-actions[bot].
          persist-credentials: false

      - name: Public release branch to public
        if: inputs.push_to_github
        run: |
          cd ${{ env.REPO_DIR }}
          git remote add public-origin https://${{ secrets.AIMET_BOT_PUB_GITHUB_TOKEN }}@github.com/qualcomm/aimet.git
          git push public-origin ${{ github.ref_name }}:${{ github.ref_name }}

      # Every wheel artifact (Linux and Windows); excludes the Docs and *-tests
      # artifacts, which aren't wheels. The release step picks the publishable
      # ones out of these.
      - name: Download artifacts
        if: inputs.push_to_github
        uses: actions/download-artifact@v4
        with:
          pattern: "*-wheel"
          path: artifacts-downloaded

      - name: Setup GitHub CLI
        if: inputs.push_to_github || inputs.push_docs
        run: |
          # Ref: https://github.com/cli/cli/blob/trunk/docs/install_linux.md
          (type -p wget >/dev/null || (sudo apt update && sudo apt-get install wget -y)) \
            && sudo mkdir -p -m 755 /etc/apt/keyrings \
                  && out=$(mktemp) && wget -nv -O$out https://cli.github.com/packages/githubcli-archive-keyring.gpg \
                  && cat $out | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null \
            && sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg \
            && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
            && sudo apt update \
            && sudo apt install gh -y

      - name: Release wheels on Github
        if: inputs.push_to_github
        env:
          GITHUB_TOKEN: ${{ secrets.AIMET_BOT_PUB_GITHUB_TOKEN }}
          tag: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # Publish every wheel without a local version; +cpu ones are test-only.
          mapfile -t wheels < <(find artifacts-downloaded \
              -regextype posix-extended \
              -regex ".*/aimet_(torch|onnx)-[0-9]+\.[0-9]+\.[0-9]+-.+\.whl" | sort)
          printf 'Publishing %s wheel(s):\n' "${#wheels[@]}"
          printf '  %s\n' ${wheels[@]+"${wheels[@]}"}

          if [ "${#wheels[@]}" -eq 0 ] ; then
            echo "::error::No publishable wheels found; refusing to release ${tag}"
            exit 1
          fi

          # Create release on public repo
          title="Version ${tag}"
          gh release create "${tag}" --repo ${{ env.PUBLIC_REPO }} --target ${{ github.ref_name }} --title "${title}" --generate-notes "${wheels[@]}"

      - name: Download Docs artifact
        if: inputs.push_docs
        uses: actions/download-artifact@v4
        with:
          name: Docs
          path: artifacts-downloaded/Docs

      - name: Checkout aimet-pages
        if: inputs.push_docs
        uses: actions/checkout@v4
        with:
          ref: master
          path: ${{ env.DOCS_REPO_DIR }}
          repository: ${{ env.DOCS_REPO }}
          github-server-url: https://github.com
          token: ${{ secrets.AIMET_BOT_PUB_GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Put up a PR for new docs
        if: inputs.push_docs
        env:
          GITHUB_TOKEN: ${{ secrets.AIMET_BOT_PUB_GITHUB_TOKEN }}
          tag: ${{ inputs.version }}
        run: |
          # Copy Docs to aimet-pages
          mkdir -p ${{ env.DOCS_REPO_DIR }}/releases/${tag}
          cp -r artifacts-downloaded/Docs/. ${{ env.DOCS_REPO_DIR }}/releases/${tag}

          # Create PR on aimet-pages
          cd ${{ env.DOCS_REPO_DIR }}
          git checkout -b ${{ github.ref_name }}

          # Update latest symlink
          unlink releases/latest || true
          ln -s ${tag} releases/latest

          # Commit doc changes
          git add releases/
          git remote add public-origin https://${{ secrets.AIMET_BOT_PUB_GITHUB_TOKEN }}@github.com/${{ env.DOCS_REPO }}.git
          git config user.email "aimet_bot@qti.qualcomm.com"
          git config user.name "aimet_bot"
          git commit -m "Release docs ${tag}" -s

          # Force push needed: aimet-pages is checked out at master and the release branch is created
          # fresh from it, so it diverges from any existing remote branch of the same name.
          # (Unlike quic/aimet, which is checked out directly on the release branch and fast-forwards.)
          git push -f public-origin ${{ github.ref_name }}

          # Create PR on quic/aimet-pages
          gh pr create --repo ${{ env.DOCS_REPO }} --base master --head ${{ github.ref_name }} --title "Release ${tag}" --body "Release docs for ${tag}"

  notify_release_on_slack:
    name: Announce release on internal channels
    needs: [ release_aimet_torch_to_pypi, release_aimet_onnx_to_pypi, release_aimet_onnx_macos_to_pypi, release_aimet_onnx_windows_x64_to_pypi, release_aimet_onnx_windows_arm64_to_pypi, release_to_github ]
    runs-on: ubuntu-latest
    steps:
      - uses: slackapi/slack-github-action@v1.25.0
        with:
          channel-id: C0898PQVA31,C02TLE1KJ3B # channel ids in order: aimet, general
          slack-message: ":rocket: *AIMET ${{ inputs.version }} released* :tada: \n *PyPI*\n- AIMET-ONNX: https://pypi.org/project/aimet-onnx/ \n- AIMET-TORCH: https://pypi.org/project/aimet-torch/ \n\n *Github*: https://github.com/quic/aimet/releases \n *Docs*: https://qualcomm.github.io/aimet-pages/releases/latest/index.html \n"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_NOTIFIER_TOKEN }}
