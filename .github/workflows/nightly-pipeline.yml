name: Fast Release Nightly CI/CD Pipeline

on:
  schedule:
    # 11 PM PDT -- (since GitHub Actions run in UTC)
    - cron: '0 6 * * *'

  # Run the workflow manually from the Actions tab
  workflow_dispatch:

  # Call workflow from other workflows
  workflow_call:
    inputs:
      ref_name:
        description: "Branch to run nightly tests on"
        required: true
        type: string

jobs:
  pre-commit-check:
    name: "Pre-commit check"
    if: github.repository_owner != 'qualcomm'
    uses: ./.github/workflows/pre-commit.yml

  set_vars:
    name: Set pipeline variables
    runs-on: ubuntu-latest
    needs: pre-commit-check
    outputs:
      ref_name: ${{ steps.set_branch_name.outputs.REF_BRANCH }}
    steps:
      - name: Set input ref_name if provided, otherwise current working ref
        id: set_branch_name
        run: |
          if [[ -n "${{ inputs.ref_name }}" ]]; then
            REF_BRANCH="${{ inputs.ref_name }}"
          else
            REF_BRANCH="${{ github.ref_name }}"
          fi

          echo "REF_BRANCH=${REF_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Using ref_name: ${REF_BRANCH} for nightly."

  variants:
    # TODO: #6790 enable testing with python 3.11 and 3.13
    name: Define supported AIMET variants
    runs-on: ubuntu-latest
    needs: set_vars
    outputs:
      matrix: ${{ steps.final.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.set_vars.outputs.ref_name }}
      # PIP_INDEX policy: the *-gpu variants build the wheels we actually
      # publish, so they use PIP_INDEX=pypi and carry no local version
      # (PyPI rejects "+cuXXX"). The *-cpu variants keep the local version and
      # are build/test-only -- they are never published anywhere.
      - name: Torch variants
        run: |
          VALUE=$(echo "${VALUE:-"{}"}" | jq -c '.include += [
              {
                 "id":              "torch-cpu",
                 "VER_PYTHON_BUILD": "3.12",
                 "VER_PYTHON_TEST":  "3.12,3.10",
                 "VER_TORCH":       "2.*",
                 "VER_ONNXRUNTIME": "",
                 "VER_CUDA":        "",
                 "RUN_UNIT_TESTS":    "ON",
                 "RUN_ACCEPTANCE_TESTS":    "ON",
                 "BUILD_TARGETS":   "all",
                 "PIP_INDEX":       ""
              },
              {
                 "id":              "torch-gpu",
                 "VER_PYTHON_BUILD": "3.12",
                 "VER_PYTHON_TEST":  "3.12",
                 "VER_TORCH":       "2.*",
                 "VER_ONNXRUNTIME": "",
                 "VER_CUDA":        "12.6.3",
                 "RUN_UNIT_TESTS":    "ON",
                 "RUN_ACCEPTANCE_TESTS":    "ON",
                 "BUILD_TARGETS":   "all",
                 "PIP_INDEX":       "pypi"
              }
            ]')
          echo "VALUE=$VALUE" >> $GITHUB_ENV
      - name: ONNX variants
        run: |
          VALUE=$(echo "${VALUE:-"{}"}" | jq -c '.include += [
              {
                 "id":              "onnx-cpu",
                 "VER_PYTHON_BUILD": "3.12",
                 "VER_PYTHON_TEST":  "3.12,3.10",
                 "VER_TORCH":       "",
                 "VER_ONNXRUNTIME": "1.19.2",
                 "VER_CUDA":        "",
                 "RUN_UNIT_TESTS":    "ON",
                 "RUN_ACCEPTANCE_TESTS":    "ON",
                 "BUILD_TARGETS":   "all",
                 "PIP_INDEX":       ""
              },
              {
                 "id":              "onnx-gpu",
                 "VER_PYTHON_BUILD": "3.12",
                 "VER_PYTHON_TEST":  "3.12",
                 "VER_TORCH":       "",
                 "VER_ONNXRUNTIME": "1.19.2",
                 "VER_CUDA":        "12.6.3",
                 "RUN_UNIT_TESTS":    "ON",
                 "RUN_ACCEPTANCE_TESTS":    "ON",
                 "BUILD_TARGETS":   "all",
                 "PIP_INDEX":       "pypi"
              }
            ]')
          echo "VALUE=$VALUE" >> $GITHUB_ENV

      - name: Doc variants
        run: |
          VALUE=$(echo "${VALUE:-"{}"}" | jq -c '.include += [
              {
                 "id":              "onnx-torch-cpu",
                 "VER_PYTHON_BUILD": "3.12",
                 "VER_PYTHON_TEST":  "3.12",
                 "VER_TORCH":       "2.*",
                 "VER_ONNXRUNTIME": "1.19.2",
                 "VER_CUDA":        "",
                 "RUN_UNIT_TESTS":    "OFF",
                 "RUN_ACCEPTANCE_TESTS":    "OFF",
                 "BUILD_TARGETS":   "all;doc",
                 "PIP_INDEX":       ""
              }
            ]')
          echo "VALUE=$VALUE" >> $GITHUB_ENV

      - name: (Last step) Generate few extra properties for each variant
        id: final
        run: |
          echo "value=$VALUE" >> $GITHUB_OUTPUT

  call-build-wheels:
    name: Call build-wheels
    needs: [ variants ]
    uses: ./.github/workflows/build-wheels.yml
    with:
      variants: ${{ needs.variants.outputs.matrix }}
      build-windows-wheel: true
    secrets: inherit

  call-unit-acceptance-tests:
    name: Run unit and acceptance tests
    needs: [ variants, call-build-wheels ]
    uses: ./.github/workflows/run-unit-acceptance-tests.yml
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.variants.outputs.matrix) }}
    with:
      ver_python: ${{ matrix.VER_PYTHON_TEST }}
      ver_cuda: ${{ matrix.VER_CUDA }}
      ver_torch: ${{ matrix.VER_TORCH }}
      ver_onnxruntime: ${{ matrix.VER_ONNXRUNTIME }}
      env_name: ${{ matrix.id }}
      run_unit_tests: ${{ matrix.RUN_UNIT_TESTS == 'ON' }}
      run_acceptance_tests: ${{ matrix.RUN_ACCEPTANCE_TESTS == 'ON' }}
      pip_index: ${{ matrix.PIP_INDEX }}
      include_windows_tests: true
    secrets: inherit

  notify_slack:
    # Post on pass and on failure so a missing message means the run is stuck.
    # Scheduled runs only, first attempt only, to avoid spamming re-runs.
    if: ${{ always() && github.event_name == 'schedule' && github.run_attempt == '1' }}
    name: Notify result on slack
    needs: [ pre-commit-check, set_vars, variants, call-build-wheels, call-unit-acceptance-tests ]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
    - name: Generate Slack message
      id: slack_msg
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
      run: |
        TITLE="[${{ github.ref_name }}] Nightly Build & Tests - for Release"
        if [ "$RUN_FAILED" = "true" ]; then
          MSG="*⚠️ $TITLE failed*"
          # List failed/cancelled jobs, trimming matrix args down to the variant id,
          # e.g. "onnx-cpu / Windows (X64)". Cancelled usually means a runner never
          # picked the job up, so keep it separate from real failures.
          JOBS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100&filter=latest" \
                   --paginate --jq '.jobs[]' | jq -rs '
            def short: sub("\\((?<id>[^,)]+)[^)]*\\)"; "(\(.id))")
                     | sub("^Run unit and acceptance tests \\((?<id>[^)]*)\\) / Run AIMET unit and acceptance tests on "; "\(.id) / ");
            (map(select(.conclusion == "failure")   | .name | short) | select(length > 0) | "Failed: " + join(", ")),
            (map(select(.conclusion == "cancelled") | .name | short) | select(length > 0) | "Cancelled: " + join(", "))')
          [ -n "$JOBS" ] && MSG="$MSG"$'\n'"$JOBS"
        else
          MSG="*✅ $TITLE passed*"
        fi
        MSG="$MSG"$'\n'"Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        echo "message<<EOF" >> $GITHUB_OUTPUT
        echo "$MSG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - uses: slackapi/slack-github-action@v1.25.0
      with:
        channel-id: C0898PQVA31
        slack-message: ${{ steps.slack_msg.outputs.message }}
      env:
        SLACK_BOT_TOKEN: ${{ secrets.SLACK_NOTIFIER_TOKEN }}
