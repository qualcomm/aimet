name: Nightly CI/CD Pipeline

on:
  schedule:
    # 11 PM PDT -- (since GitHub Actions run in UTC)
    - cron: '0 6 * * *'

  # Run the workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      enable_linux:
        description: "Build and test the Linux wheel"
        required: false
        type: boolean
        default: true
      enable_windows:
        description: "Build and test the Windows wheel"
        required: false
        type: boolean
        default: true
      enable_macos:
        description: "Build and test the macOS (arm64) wheel"
        required: false
        type: boolean
        default: true

  # Call workflow from other workflows
  workflow_call:
    secrets:
      SLACK_NOTIFIER_TOKEN:
        required: false
    inputs:
      ref_name:
        description: "Branch to run nightly tests on"
        required: true
        type: string
      enable_linux:
        description: "Build and test the Linux wheel"
        required: false
        type: boolean
        default: true
      enable_windows:
        description: "Build and test the Windows wheel"
        required: false
        type: boolean
        default: true
      enable_macos:
        description: "Build and test the macOS (arm64) wheel"
        required: false
        type: boolean
        default: true

jobs:
  pre-commit-check:
    name: Lint
    if: github.repository_owner != 'qualcomm'
    uses: ./.github/workflows/pre-commit.yml

  set_vars:
    name: Set pipeline variables
    runs-on: ubuntu-latest
    needs: pre-commit-check
    outputs:
      ref_name: ${{ steps.set_branch_name.outputs.REF_BRANCH }}
    steps:
      - name: Set input ref_name if provided, otherwise current working ref
        id: set_branch_name
        env:
          INPUT_REF_NAME: ${{ inputs.ref_name }}
        run: |
          if [[ -n "${INPUT_REF_NAME}" ]]; then
            REF_BRANCH="${INPUT_REF_NAME}"
          else
            REF_BRANCH="${GITHUB_REF_NAME}"
          fi

          echo "REF_BRANCH=${REF_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Using ref_name: ${REF_BRANCH} for nightly."

  variants:
    # TODO: #6790 enable testing with python 3.11 and 3.13
    name: Variants
    runs-on: ubuntu-latest
    needs: set_vars
    outputs:
      matrix: ${{ steps.final.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.set_vars.outputs.ref_name }}
      # pip_index policy: the *-gpu variants build the wheels we actually
      # publish, so they use pip_index=pypi and carry no local version
      # (PyPI rejects "+cuXXX"). The *-cpu variants keep the local version and
      # are build/test-only -- they are never published anywhere.
      - name: Torch variants
        if: github.event_name == 'schedule' || inputs.enable_linux
        run: |
          VALUE=$(echo "${VALUE:-"{}"}" | jq -c '.include += [
              {
                 "id":              "torch-cpu-linux-x86",
                 "platform":        "linux",
                 "package":         "aimet_torch",
                 "ver_python_build": "3.12",
                 "ver_python_test":  "3.12,3.10",
                 "ver_torch":       "2.*",
                 "ver_onnxruntime": "",
                 "ver_cuda":        "",
                 "run_unit_tests":    "ON",
                 "run_acceptance_tests":    "ON",
                 "pip_index":       ""
              },
              {
                 "id":              "torch-gpu-linux-x86",
                 "platform":        "linux",
                 "package":         "aimet_torch",
                 "ver_python_build": "3.12",
                 "ver_python_test":  "3.12",
                 "ver_torch":       "2.*",
                 "ver_onnxruntime": "",
                 "ver_cuda":        "13.2.0",
                 "run_unit_tests":    "ON",
                 "run_acceptance_tests":    "OFF",
                 "pip_index":       "pypi"
              }
            ]')
          echo "VALUE=$VALUE" >> $GITHUB_ENV

      # ONNX only ever ships as a Linux + Windows + macOS wheel, so the
      # Windows/macOS cross-compile/native variants live here too, each
      # independently gated by its own enable_* input.
      - name: ONNX variants (Linux)
        if: github.event_name == 'schedule' || inputs.enable_linux
        run: |
          VALUE=$(echo "${VALUE:-"{}"}" | jq -c '.include += [
              {
                 "id":              "onnx-cpu-linux-x86",
                 "platform":        "linux",
                 "package":         "aimet_onnx",
                 "build_cpp_tests": "ON",
                 "ver_python_build": "3.12",
                 "ver_python_test":  "3.12,3.10",
                 "ver_torch":       "",
                 "ver_onnxruntime": "1.19.2",
                 "ver_cuda":        "",
                 "run_unit_tests":    "ON",
                 "run_acceptance_tests":    "OFF",
                 "pip_index":       ""
              },
              {
                 "id":              "onnx-gpu-linux-x86",
                 "platform":        "linux",
                 "package":         "aimet_onnx",
                 "build_cpp_tests": "ON",
                 "ver_python_build": "3.12",
                 "ver_python_test":  "3.12",
                 "ver_torch":       "",
                 "ver_onnxruntime": "1.19.2",
                 "ver_cuda":        "13.2.0",
                 "run_unit_tests":    "ON",
                 "run_acceptance_tests":    "OFF",
                 "pip_index":       "pypi"
              }
            ]')
          echo "VALUE=$VALUE" >> $GITHUB_ENV

      - name: ONNX variants (Windows)
        if: github.event_name == 'schedule' || inputs.enable_windows
        run: |
          VALUE=$(echo "${VALUE:-"{}"}" | jq -c '.include += [
              {
                 "id":              "onnx-cpu-windows-x64",
                 "platform":        "windows",
                 "arch":            "x64",
                 "package":         "aimet_onnx",
                 "ver_python_build": "3.12",
                 "ver_python_test":  "3.10",
                 "ver_onnxruntime": "1.19.2",
                 "windows_vcpkg_triplet": "x64-windows",
                 "run_unit_tests":    "ON",
                 "run_acceptance_tests":    "OFF",
                 "pip_index":       "pypi"
              },
              {
                 "id":              "onnx-cpu-windows-arm64",
                 "platform":        "windows",
                 "arch":            "arm64",
                 "package":         "aimet_onnx",
                 "ver_python_build": "3.12",
                 "ver_python_test":  "3.12",
                 "ver_onnxruntime": "1.19.2",
                 "windows_vcpkg_triplet": "arm64-windows",
                 "run_unit_tests":    "ON",
                 "run_acceptance_tests":    "OFF",
                 "pip_index":       "pypi"
              }
            ]')
          echo "VALUE=$VALUE" >> $GITHUB_ENV

      - name: ONNX variants (macOS)
        if: github.event_name == 'schedule' || inputs.enable_macos
        run: |
          VALUE=$(echo "${VALUE:-"{}"}" | jq -c '.include += [
              {
                 "id":              "onnx-cpu-macos-arm64",
                 "platform":        "macos",
                 "arch":            "arm64",
                 "package":         "aimet_onnx",
                 "build_cpp_tests": "ON",
                 "ver_python_build": "3.12",
                 "ver_python_test":  "3.12",
                 "ver_onnxruntime": "1.19.2",
                 "macos_deployment_target": "15.0",
                 "run_unit_tests":    "ON",
                 "run_acceptance_tests":    "OFF",
                 "pip_index":       "pypi"
              }
            ]')
          echo "VALUE=$VALUE" >> $GITHUB_ENV

      - name: Doc variants
        if: github.event_name == 'schedule' || inputs.enable_linux
        run: |
          VALUE=$(echo "${VALUE:-"{}"}" | jq -c '.include += [
              {
                 "id":              "docs-linux-x86",
                 "platform":        "linux",
                 "package":         "docs",
                 "ver_python_build": "3.12",
                 "ver_python_test":  "3.12",
                 "ver_torch":       "2.*",
                 "ver_onnxruntime": "1.19.2",
                 "ver_cuda":        "",
                 "run_unit_tests":    "OFF",
                 "run_acceptance_tests":    "OFF",
                 "pip_index":       ""
              }
            ]')
          echo "VALUE=$VALUE" >> $GITHUB_ENV

      - name: (Last step) Generate few extra properties for each variant
        id: final
        run: |
          echo "value=$VALUE" >> $GITHUB_OUTPUT

  # Each variant now carries its own "platform" (and, for windows, "arch"),
  # so build-wheels.yml / run-unit-acceptance-tests.yml no longer need
  # per-platform enable flags -- enable_linux/enable_windows/enable_macos are
  # applied earlier, by the variants job deciding which entries to emit.
  call-build-wheels:
    name: Build
    needs: [ variants ]
    uses: ./.github/workflows/build-wheels.yml
    with:
      variants: ${{ needs.variants.outputs.matrix }}

  call-unit-acceptance-tests:
    name: Test
    needs: [ variants, call-build-wheels ]
    permissions:
      contents: read
    uses: ./.github/workflows/run-unit-acceptance-tests.yml
    with:
      variants: ${{ needs.variants.outputs.matrix }}

  notify_slack:
    # Post on pass and on failure so a missing message means the run is stuck.
    # Scheduled runs only, first attempt only, to avoid spamming re-runs.
    if: ${{ always() && github.repository_owner != 'qualcomm' && github.event_name == 'schedule' && github.run_attempt == '1' }}
    name: Notify result on slack
    needs: [ pre-commit-check, set_vars, variants, call-build-wheels, call-unit-acceptance-tests ]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
    - name: Generate Slack message
      id: slack_msg
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
      run: |
        TITLE="[${GITHUB_REF_NAME}] Nightly Build & Tests - for Release"
        if [ "$RUN_FAILED" = "true" ]; then
          MSG="*⚠️ $TITLE failed*"
          # List failed/cancelled jobs, trimming matrix args down to the variant id,
          # e.g. "onnx-cpu-windows-x64". Cancelled usually means a runner never
          # picked the job up, so keep it separate from real failures.
          JOBS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100&filter=latest" \
                   --paginate --jq '.jobs[]' | jq -rs '
            def short: sub("\\((?<id>[^,)]+)[^)]*\\)"; "(\(.id))")
                     | sub("^Test \\((?<id>[^)]*)\\) / "; "\(.id) / ");
            (map(select(.conclusion == "failure")   | .name | short) | select(length > 0) | "Failed: " + join(", ")),
            (map(select(.conclusion == "cancelled") | .name | short) | select(length > 0) | "Cancelled: " + join(", "))')
          [ -n "$JOBS" ] && MSG="$MSG"$'\n'"$JOBS"
        else
          MSG="*✅ $TITLE passed*"
        fi
        MSG="$MSG"$'\n'"Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        echo "message<<EOF" >> $GITHUB_OUTPUT
        echo "$MSG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - uses: slackapi/slack-github-action@v1.25.0
      with:
        channel-id: C0898PQVA31
        slack-message: ${{ steps.slack_msg.outputs.message }}
      env:
        SLACK_BOT_TOKEN: ${{ secrets.SLACK_NOTIFIER_TOKEN }}
