name: Nightly Regression

on:
  schedule:
    - cron: '0 6 * * *'

  workflow_dispatch:
    inputs:
      framework:
        description: 'Framework to run'
        required: false
        type: choice
        options:
          - all
          - onnx
          - torch
        default: 'all'

      suite:
        description: 'Test suite'
        required: false
        type: choice
        options:
          - nightly
          - smoke
        default: 'nightly'

jobs:
  #=============================================================================
  # Build AIMET Wheels (Parallel)
  #=============================================================================
  build-aimet-onnx-gpu:
    name: Build AIMET (ONNX + GPU)
    if: ${{ github.event.inputs.framework != 'torch' }}
    uses: ./.github/workflows/build-wheels.yml
    with:
      variants: >
        {"include":[{
          "id":"onnx-gpu",
          "runs-on":"k8s-gpu-release",
          "VER_PYTHON":"3.10",
          "VER_ONNXRUNTIME":"1.19.2",
          "VER_CUDA":"12.6.0",
          "ENABLE_TESTS":"OFF",
          "PIP_INDEX":""
        }]}
      image-tag: latest
    secrets: inherit

  build-aimet-torch-gpu:
    name: Build AIMET (Torch + GPU)
    if: ${{ github.event.inputs.framework != 'onnx' }}
    uses: ./.github/workflows/build-wheels.yml
    with:
      variants: >
        {"include":[{
          "id":"torch-gpu",
          "runs-on":"k8s-gpu-release",
          "VER_PYTHON":"3.10",
          "VER_TORCH":"2.*",
          "VER_CUDA":"12.6.0",
          "ENABLE_TESTS":"OFF",
          "PIP_INDEX":""
        }]}
      image-tag: latest
    secrets: inherit

  #=============================================================================
  # ONNX Regression
  #=============================================================================
  onnx-regression:
    name: ONNX Regression
    needs: build-aimet-onnx-gpu
    if: ${{ github.event.inputs.framework != 'torch' }}
    runs-on: k8s-gpu-release

    container:
      image: "${{ vars.DOCKER_REGISTRY }}/${{ vars.DOCKER_IMAGE }}-onnx-gpu:latest"
      credentials:
        username: ${{ secrets.DOCKER_LOGIN }}
        password: ${{ secrets.DOCKER_CREDENTIALS }}
      options: --gpus all

    timeout-minutes: 720

    env:
      CUDA_VISIBLE_DEVICES: "0"
      PYTHONUNBUFFERED: "1"
      UV_LINK_MODE: "symlink"
      INPUT_SUITE: ${{ github.event.inputs.suite || 'nightly' }}-onnx
      WORKFLOW_FILE: "nightly-regression.yaml"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download AIMET wheel
        uses: actions/download-artifact@v3
        with:
          name: onnx-gpu-wheel
          path: downloads

      - name: Install system dependencies
        run: |
          apt-get update -qq
          apt-get install -y \
            libgl1-mesa-glx libglib2.0-0 libsm6 libxext6 \
            libxrender-dev libgomp1 git openssh-client unzip curl
          apt-get clean
          rm -rf /var/lib/apt/lists/*

      - name: Setup Python environment
        run: |
          set -e
          apt-get update -qq
          apt-get install -y python3.10 python3.10-venv python3.10-dev

          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"

          uv venv .venv --python python3.10
          . .venv/bin/activate

          uv pip install qai-hub qai-hub-models
          uv pip install onnxruntime-gpu==1.19.2
          uv pip install pynvml pytest requests
          uv pip install mmpose --no-deps  # Required by hrnet_pose (not in qai-hub-models extras)

      - name: Install AIMET
        run: |
          . .venv/bin/activate
          export PATH="$HOME/.local/bin:$PATH"
          uv pip install downloads/*.whl
          python -c "import aimet_onnx; print('AIMET version:', aimet_onnx.__version__)"

      - name: Pin numpy (avoid ml_dtypes segfault with numpy 2.x)
        run: |
          . .venv/bin/activate
          export PATH="$HOME/.local/bin:$PATH"
          uv pip install "numpy<2"

      - name: Verify ONNX Runtime GPU
        run: |
          . .venv/bin/activate
          python -c "
          import onnxruntime as ort
          providers = ort.get_available_providers()
          print('ONNX Runtime providers:', providers)
          assert 'CUDAExecutionProvider' in providers
          "

      - name: Download baseline
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . .venv/bin/activate
          python -m AIMETRegression.workflow.artifacts download-baseline \
            --output-dir AIMETRegression/baselines/downloaded

      - name: Setup baseline
        run: |
          . .venv/bin/activate
          python -m AIMETRegression.workflow.utils setup-baseline --suite "$INPUT_SUITE"

      - name: Run test suite
        run: |
          . .venv/bin/activate
          python -m AIMETRegression.suite_runner --suite "$INPUT_SUITE"

      - name: Compare with baseline
        run: |
          . .venv/bin/activate

          RESULTS_CSV="AIMETRegression/reports/results_${INPUT_SUITE}.csv"

          if [ ! -f "$RESULTS_CSV" ]; then
            echo "Results CSV not found: $RESULTS_CSV"
            exit 1
          fi

          python AIMETRegression/baseline_comparison.py run \
            --results "$RESULTS_CSV" \
            --suite-name "$INPUT_SUITE" \
            --baselines-dir "AIMETRegression/baselines" \
            --github-summary \
            --output-file "AIMETRegression/reports/comparison_summary.json"

      - name: Generate lockfile
        if: always()
        run: |
          . .venv/bin/activate
          export PATH="$HOME/.local/bin:$PATH"
          python -m AIMETRegression.workflow.utils generate-lockfile \
            --run-id "${{ github.run_id }}"

      - name: Generate timestamp
        if: always()
        id: timestamp
        run: |
          echo "datetime=$(date '+%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Generate artifact name
        id: artifact_name
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . .venv/bin/activate
          ARTIFACT_NAME=$(python -c "
          from AIMETRegression.workflow.artifacts import ArtifactManager, WorkflowConfig
          config = WorkflowConfig.from_env()
          manager = ArtifactManager(config)
          print(manager.get_artifact_name('${{ github.ref_name }}', '$INPUT_SUITE'))
          ")
          echo "name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT

      - name: Upload baseline artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: AIMETRegression/baselines/latest.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload comparison summary
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: onnx-comparison-summary
          path: AIMETRegression/reports/comparison_summary.json
          retention-days: 10
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: onnx-reports-${{ steps.timestamp.outputs.datetime }}-${{ github.run_id }}
          path: AIMETRegression/reports/**/*
          retention-days: 30

  #=============================================================================
  # Torch Regression
  #=============================================================================
  torch-regression:
    name: Torch Regression
    needs: build-aimet-torch-gpu
    if: ${{ github.event.inputs.framework != 'onnx' }}
    runs-on: k8s-gpu-release

    container:
      image: "${{ vars.DOCKER_REGISTRY }}/${{ vars.DOCKER_IMAGE }}-torch-gpu:latest"
      credentials:
        username: ${{ secrets.DOCKER_LOGIN }}
        password: ${{ secrets.DOCKER_CREDENTIALS }}
      options: --gpus all

    timeout-minutes: 720

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONFAULTHANDLER: "1"
      INPUT_SUITE: ${{ github.event.inputs.suite || 'nightly' }}-torch
      WORKFLOW_FILE: "nightly-regression.yaml"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      UV_LINK_MODE: "symlink"
      VER_PYTHON: "3.10"
      VER_TORCH: "2.*"
      VER_CUDA_SHORT: "cu126"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download AIMET wheel
        uses: actions/download-artifact@v3
        with:
          name: torch-gpu-wheel
          path: downloads

      - name: Install system dependencies
        run: |
          apt-get update -qq
          apt-get install -y \
            libgl1-mesa-glx libglib2.0-0 libsm6 libxext6 \
            libxrender-dev libgomp1 git openssh-client unzip curl
          apt-get clean
          rm -rf /var/lib/apt/lists/*

      - name: Setup Python environment
        run: |
          set -e
          apt-get update -qq
          apt-get install -y python${{ env.VER_PYTHON }} python${{ env.VER_PYTHON }}-venv python${{ env.VER_PYTHON }}-dev

          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"

          uv venv .venv --python python${{ env.VER_PYTHON }}
          . .venv/bin/activate

          uv pip install torch==${{ env.VER_TORCH }} torchvision --index-url https://download.pytorch.org/whl/${{ env.VER_CUDA_SHORT }}
          uv pip install qai-hub qai-hub-models
          uv pip install pynvml pytest requests object-detection-metrics
          uv pip install mmpose --no-deps  # Required by hrnet_pose (not in qai-hub-models extras)

      - name: Install AIMET
        run: |
          . .venv/bin/activate
          export PATH="$HOME/.local/bin:$PATH"
          uv pip install downloads/*.whl
          python -c "import aimet_torch; print('AIMET Torch version:', aimet_torch.__version__)"

      - name: Pin numpy (avoid ml_dtypes segfault with numpy 2.x)
        run: |
          . .venv/bin/activate
          export PATH="$HOME/.local/bin:$PATH"
          uv pip install "numpy<2"

      - name: Verify PyTorch GPU
        run: |
          . .venv/bin/activate
          python -c "
          import torch
          print('PyTorch version:', torch.__version__)
          print('CUDA available:', torch.cuda.is_available())
          if torch.cuda.is_available():
              print('CUDA device:', torch.cuda.get_device_name(0))
          assert torch.cuda.is_available(), 'CUDA not available!'
          "

      - name: Download baseline
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . .venv/bin/activate
          python -m AIMETRegression.workflow.artifacts download-baseline \
            --output-dir AIMETRegression/baselines/downloaded

      - name: Setup baseline
        run: |
          . .venv/bin/activate
          python -m AIMETRegression.workflow.utils setup-baseline --suite "$INPUT_SUITE"

      - name: Run test suite
        run: |
          . .venv/bin/activate
          python -m AIMETRegression.suite_runner --suite "$INPUT_SUITE"

      - name: Compare with baseline
        run: |
          . .venv/bin/activate

          RESULTS_CSV="AIMETRegression/reports/results_${INPUT_SUITE}.csv"

          if [ ! -f "$RESULTS_CSV" ]; then
            echo "Results CSV not found: $RESULTS_CSV"
            exit 1
          fi

          python AIMETRegression/baseline_comparison.py run \
            --results "$RESULTS_CSV" \
            --suite-name "$INPUT_SUITE" \
            --baselines-dir "AIMETRegression/baselines" \
            --github-summary \
            --output-file "AIMETRegression/reports/comparison_summary.json"

      - name: Generate lockfile
        if: always()
        run: |
          . .venv/bin/activate
          export PATH="$HOME/.local/bin:$PATH"
          python -m AIMETRegression.workflow.utils generate-lockfile \
            --run-id "${{ github.run_id }}"

      - name: Generate timestamp
        if: always()
        id: timestamp
        run: |
          echo "datetime=$(date '+%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Generate artifact name
        id: artifact_name
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . .venv/bin/activate
          ARTIFACT_NAME=$(python -c "
          from AIMETRegression.workflow.artifacts import ArtifactManager, WorkflowConfig
          config = WorkflowConfig.from_env()
          manager = ArtifactManager(config)
          print(manager.get_artifact_name('${{ github.ref_name }}', '$INPUT_SUITE'))
          ")
          echo "name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT

      - name: Upload baseline artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: AIMETRegression/baselines/latest.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload comparison summary
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: torch-comparison-summary
          path: AIMETRegression/reports/comparison_summary.json
          retention-days: 10
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: torch-reports-${{ steps.timestamp.outputs.datetime }}-${{ github.run_id }}
          path: AIMETRegression/reports/**/*
          retention-days: 30

  #=============================================================================
  # Results
  #=============================================================================
  results:
    name: Results
    needs: [onnx-regression, torch-regression]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download ONNX comparison summary
        if: ${{ needs.onnx-regression.result == 'success' }}
        uses: actions/download-artifact@v3
        with:
          name: onnx-comparison-summary
          path: summaries/onnx

      - name: Download Torch comparison summary
        if: ${{ needs.torch-regression.result == 'success' }}
        uses: actions/download-artifact@v3
        with:
          name: torch-comparison-summary
          path: summaries/torch

      - name: Generate summary
        run: |
          python3 AIMETRegression/workflow/summary.py \
            --onnx-status "${{ needs.onnx-regression.result }}" \
            --torch-status "${{ needs.torch-regression.result }}" \
            --onnx-summary "summaries/onnx/comparison_summary.json" \
            --torch-summary "summaries/torch/comparison_summary.json" \
            --suite "${{ github.event.inputs.suite || 'nightly' }}" \
            --trigger "${{ github.event_name }}" \
            >> $GITHUB_STEP_SUMMARY

      - name: Set exit status
        run: |
          ONNX_STATUS="${{ needs.onnx-regression.result }}"
          TORCH_STATUS="${{ needs.torch-regression.result }}"

          # Fail if any non-skipped job failed
          if [ "$ONNX_STATUS" = "failure" ] || [ "$TORCH_STATUS" = "failure" ]; then
            echo "One or more regression jobs failed"
            exit 1
          fi