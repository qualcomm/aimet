name: Run Unit and Acceptance tests

# One matrixed job across every platform, keyed the same way as
# build-wheels.yml ("platform": "linux" | "windows" | "macos", and for
# windows an "arch"). Linux variants additionally fan out over multiple
# Python versions (e.g. "3.12,3.10") via a nested matrix; Windows/macOS
# variants test exactly one Python version each, so they skip that fan-out.

on:
  workflow_call:
    inputs:
      variants:
        required: true
        type: string

jobs:
  # Expands each Linux variant's comma-separated ver_python into its own
  # matrix leg; Windows/macOS variants pass through as a single leg each.
  expand_python_versions:
    name: setup
    runs-on: tetra-ubuntu-2204
    outputs:
      matrix: ${{ steps.expand.outputs.matrix }}
    steps:
      - name: Expand comma-separated ver_python per variant
        id: expand
        env:
          VARIANTS: ${{ inputs.variants }}
        run: |
          # For each variant, "3.12,3.10" becomes two legs differing only in
          # ver_python; a platform without a comma (or windows/macos, which
          # are always single-version) stays a single leg. Variants with
          # both RUN_UNIT_TESTS and RUN_ACCEPTANCE_TESTS off (e.g. the docs
          # build) are dropped here -- the `matrix` context isn't available
          # in a job-level `if:`, so this is the only place to skip them.
          matrix=$(echo "$VARIANTS" | jq -c '
            [ .include[] | select(.RUN_UNIT_TESTS == "ON" or .RUN_ACCEPTANCE_TESTS == "ON") | . as $base |
              (($base.VER_PYTHON_TEST // $base.VER_PYTHON_BUILD // $base.VER_PYTHON // "3.12") | split(",")) as $versions |
              $versions[] | $base + {ver_python: .}
            ]
          ' | jq -c '{include: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test:
    name: >-
      ${{ matrix.platform == 'linux' && format('{0} py{1}', matrix.id, matrix.ver_python) || matrix.id }}
    needs: [ expand_python_versions ]
    runs-on: >-
      ${{
        matrix.platform == 'windows' && (matrix.arch == 'arm64' && 'aimet-windows-arm64' || 'aimet-windows-amd64') ||
        matrix.platform == 'macos' && 'aimet-mac-arm64' ||
        (matrix.VER_CUDA != '' && 'mlops-ci-gpu-large' || 'mlops-ci-cpu')
      }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.expand_python_versions.outputs.matrix) }}
    defaults:
      run:
        shell: ${{ matrix.platform == 'windows' && 'powershell' || 'bash' }}
    env:
      pytest_github_report: true
      pytest_use_zeros: true
      PACKAGE: ${{ matrix.PACKAGE }}
    steps:
      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y git curl g++ ca-certificates cmake make
          rm -rf download

      - name: Set CUDA_HOME for GPU builds
        if: matrix.VER_CUDA != ''
        run: |
          # Set CUDA_HOME for deepspeed and other CUDA-dependent packages
          echo "CUDA_HOME=/usr/local/cuda" >> $GITHUB_ENV

      - uses: actions/checkout@v4

      - name: Redirect temp directories to workspace for automated cleanup (Windows)
        if: matrix.platform == 'windows'
        run: |
          $env:TEMP = "$env:GITHUB_WORKSPACE\temp"
          $env:TMP = "$env:GITHUB_WORKSPACE\temp"

      - uses: actions/download-artifact@v4
        with:
          name: "${{ matrix.id }}-wheel"
          path: "downloads"

      - uses: actions/download-artifact@v4
        if: matrix.RUN_UNIT_TESTS == 'ON' && matrix.BUILD_CPP_TESTS == 'ON'
        with:
          name: "${{ matrix.id }}-tests"
          path: "downloads"

      # Acceptance tests exercise torch and onnx together, so both CPU/GPU
      # wheels are downloaded regardless of which variant's leg this is.
      - uses: actions/download-artifact@v4
        if: matrix.platform == 'linux' && matrix.RUN_ACCEPTANCE_TESTS == 'ON'
        with:
          name: "torch-${{ matrix.VER_CUDA == '' && 'cpu' || 'gpu' }}-linux-x86-wheel"
          path: "downloads"

      - uses: actions/download-artifact@v4
        if: matrix.platform == 'linux' && matrix.RUN_ACCEPTANCE_TESTS == 'ON'
        with:
          name: "onnx-${{ matrix.VER_CUDA == '' && 'cpu' || 'gpu' }}-linux-x86-wheel"
          path: "downloads"

      - name: Create python virtual environment (Linux)
        if: matrix.platform == 'linux' && matrix.PACKAGE != 'docs'
        uses: ./.github/actions/setup-uv-env
        with:
          ENV_NAME: ${{ matrix.id }}
          VER_PYTHON: ${{ matrix.ver_python }}

      - uses: ./.github/actions/setup-uv-env
        if: matrix.platform == 'windows' || matrix.platform == 'macos'
        with:
          ENV_NAME: ${{ matrix.id }}
          VER_PYTHON: ${{ matrix.ver_python }}

      - name: Install test dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          . ./${{ matrix.id }}/bin/activate

          python3 scripts/all/build_and_test.py --task install_test_deps \
            --package "$PACKAGE" \
            --venv "${{ matrix.id }}" \
            --wheel-dir "downloads" \
            --ver-cuda "${{ matrix.VER_CUDA }}" \
            --only

      - name: Run pylint (Linux)
        if: matrix.platform == 'linux'
        run: |
          . ./${{ matrix.id }}/bin/activate
          UV_PYTHONPATH="./${{ matrix.id }}/lib/python${{ matrix.ver_python }}/site-packages"

          # Set LD_LIBRARY_PATH for dynamic linking with libpython3.so
          PYTHON_LIB_PATH=$(python3 -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")
          export LD_LIBRARY_PATH="${PYTHON_LIB_PATH}:${LD_LIBRARY_PATH}"

          if [[ "$PACKAGE" == "aimet_onnx" ]] ; then
              AIMET_ONNX_PATH=$(find $UV_PYTHONPATH -regex ".*/aimet_onnx")
              if [ -z "$AIMET_ONNX_PATH" ]; then
                echo "aimet_onnx package not found in $UV_PYTHONPATH"
              fi
              python -m pylint --rcfile=.pylintrc $AIMET_ONNX_PATH
          elif [[ "$PACKAGE" == "aimet_torch" ]] ; then
            AIMET_TORCH_PATH=$(find $UV_PYTHONPATH -regex ".*/aimet_torch")
            if [ -z "$AIMET_TORCH_PATH" ]; then
              echo "aimet_torch package not found in $UV_PYTHONPATH"
            fi
            python -m pylint --rcfile=.pylintrc $AIMET_TORCH_PATH
          fi

      - name: Run Unit tests
        if: matrix.RUN_UNIT_TESTS == 'ON'
        uses: ./.github/actions/test
        with:
          task: unit_test
          id: ${{ matrix.id }}
          platform: ${{ matrix.platform }}
          package: ${{ env.PACKAGE }}
          ver-cuda: ${{ matrix.VER_CUDA }}

      - name: Run Acceptance tests
        if: matrix.RUN_ACCEPTANCE_TESTS == 'ON'
        uses: ./.github/actions/test
        with:
          task: acceptance_test
          id: ${{ matrix.id }}
          platform: ${{ matrix.platform }}
          package: ${{ env.PACKAGE }}
          ver-cuda: ${{ matrix.VER_CUDA }}
