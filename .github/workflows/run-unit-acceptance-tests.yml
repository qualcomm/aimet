name: Run Unit and Acceptance tests

on:
  workflow_call:
    inputs:
      env_name:
        required: false
        type: string
        default: aimet-dev
      ver_python:
        description: "Comma-separated Python versions to test, e.g. '3.10,3.11,3.12'"
        required: false
        type: string
        default: "3.12"
      ver_cuda:
        required: false
        type: string
        default: ""
      ver_torch:
        required: false
        type: string
        default: ""
      ver_onnxruntime:
        required: false
        type: string
        default: ""
      pip_index:
        required: false
        type: string
        default: ""
      run_unit_tests:
        required: false
        type: boolean
        default: false
      run_acceptance_tests:
        required: false
        type: boolean
        default: false
      include_windows_tests:
        required: false
        type: boolean
        default: false
      include_macos_tests:
        required: false
        type: boolean
        default: false
      include_linux_tests:
        description: "Run the Ubuntu test job at all"
        required: false
        type: boolean
        default: true

jobs:
  parse_python_versions:
    name: Parse Python versions
    runs-on: tetra-ubuntu-2204
    outputs:
      python_versions: ${{ steps.set-matrix.outputs.python_versions }}
    steps:
      - name: Convert comma-separated Python versions to JSON array
        id: set-matrix
        run: |
          # Convert "3.10,3.11,3.12" to JSON array ["3.10","3.11","3.12"]
          versions="${{ inputs.ver_python }}"
          json_array=$(echo "$versions" | tr ',' '\n' | jq -R . | jq -sc .)
          echo "python_versions={\"ver_python\":$json_array}" >> $GITHUB_OUTPUT

  test_on_linux:
    name: Run AIMET unit and acceptance tests on Ubuntu (Python ${{ matrix.ver_python }})
    needs: [parse_python_versions]
    # CUDA variants need a real GPU; CPU-only variants stay on the CPU pool.
    runs-on: ${{ inputs.ver_cuda != '' && 'mlops-ci-gpu-large' || 'mlops-ci-cpu' }}
    if: ${{ inputs.include_linux_tests && (inputs.run_unit_tests || inputs.run_acceptance_tests) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.parse_python_versions.outputs.python_versions) }}
    env:
      pytest_github_report: true
      pytest_use_zeros: true
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y git curl g++ ca-certificates cmake make
          rm -rf download
      - name: Set CUDA_HOME for GPU builds
        if: inputs.ver_cuda != ''
        run: |
          # Set CUDA_HOME for deepspeed and other CUDA-dependent packages
          echo "CUDA_HOME=/usr/local/cuda" >> $GITHUB_ENV
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: "${{ inputs.env_name }}-wheel"
          path: "downloads"
      - uses: actions/download-artifact@v4
        if: inputs.ver_onnxruntime != ''
        with:
          name: "${{ inputs.env_name }}-tests"
          path: "downloads"
      # Download both aimet-torch and aimet-onnx wheels for acceptance tests
      # for joint testing of torch and onnx packages in the same environment
      - uses: actions/download-artifact@v4
        if: inputs.run_acceptance_tests
        with:
          name: "torch-${{ inputs.ver_cuda == '' && 'cpu' || 'gpu' }}-wheel"
          path: "downloads"
      - uses: actions/download-artifact@v4
        if: inputs.run_acceptance_tests
        with:
          name: "onnx-${{ inputs.ver_cuda == '' && 'cpu' || 'gpu' }}-wheel"
          path: "downloads"
      - name: Create python virtual environment
        if: ${{ inputs.env_name  != 'onnx-torch-cpu' }}
        uses: ./.github/actions/setup-uv-env
        with:
          ENV_NAME: ${{ inputs.env_name }}
          VER_PYTHON: ${{ matrix.ver_python }}
      - name: Install test dependencies
        shell: bash
        run: |
          . ./${{ inputs.env_name }}/bin/activate

          python3 -m ensurepip --upgrade
          python3 -m pip install uv

          if [[ "${{ inputs.run_acceptance_tests }}" == 'true' ]]; then
            # Install both aimet-torch and aimet-onnx wheels for acceptance tests
            # for joint testing of torch and onnx packages in the same environment
            WHEEL_PATHS=$(find downloads -name "aimet_*.whl")
          elif [[ "${{ inputs.env_name }}" == "torch-cpu" || "${{ inputs.env_name }}" == "torch-gpu" ]]; then
            WHEEL_PATHS=$(find downloads -name "aimet_torch*.whl" | head -n 1)
          elif [[ "${{ inputs.env_name }}" == "onnx-cpu" || "${{ inputs.env_name }}" == "onnx-gpu" ]]; then
            WHEEL_PATHS=$(find downloads -name "aimet_onnx*.whl" | head -n 1)
          fi

          # Install test dependencies
          cu=$(echo "${{ inputs.ver_cuda }}" | awk -F'.' '{print ($1!="")? "cu"$1$2 : "cpu"}')
          for wheel in $WHEEL_PATHS; do
            python3 -m uv pip install "${wheel}[test]" \
                --extra-index-url="https://download.pytorch.org/whl/${cu}" \
                --index-strategy unsafe-best-match
          done

          # TODO #8090: cap onnxruntime(-gpu) at <=1.26 so onnx-cpu and
          # onnx-gpu test against comparable ORT versions. Needed because
          # onnxruntime-gpu>=1.27 requires CUDA 13/cuDNN 9, but our GPU runners'
          # driver (575.57.08, CUDA 12.9 API) only supports CUDA 12.x.
          # Remove once the fleet's driver is r580+.
          if [[ "$WHEEL_PATHS" == *aimet_onnx* ]]; then
            if [[ "${{ inputs.ver_cuda }}" != "" ]]; then
              python3 -m uv pip install --reinstall --no-deps "onnxruntime-gpu<=1.26"
            else
              python3 -m uv pip install --reinstall --no-deps "onnxruntime<=1.26"
            fi
          fi
      - name: Run pylint
        run: |
          . ./${{ inputs.env_name }}/bin/activate
          UV_PYTHONPATH="./${{ inputs.env_name }}/lib/python${{ matrix.ver_python }}/site-packages"

          # Set LD_LIBRARY_PATH for dynamic linking with libpython3.so
          PYTHON_LIB_PATH=$(python3 -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")
          export LD_LIBRARY_PATH="${PYTHON_LIB_PATH}:${LD_LIBRARY_PATH}"

          # Run pylint on aimet-onnx or aimet-torch
          if [ "${{ inputs.ver_onnxruntime }}" != "" ] ; then
              AIMET_ONNX_PATH=$(find $UV_PYTHONPATH -regex ".*/aimet_onnx")
              if [ -z "$AIMET_ONNX_PATH" ]; then
                echo "aimet_onnx package not found in $UV_PYTHONPATH"
              fi
              python -m pylint --rcfile=.pylintrc $AIMET_ONNX_PATH
          elif [ "${{ inputs.ver_torch }}" != "" ] ; then
            AIMET_TORCH_PATH=$(find $UV_PYTHONPATH -regex ".*/aimet_torch")
            if [ -z "$AIMET_TORCH_PATH" ]; then
              echo "aimet_torch package not found in $UV_PYTHONPATH"
            fi
            python -m pylint --rcfile=.pylintrc $AIMET_TORCH_PATH
          fi

      - name: Run Unit tests
        if: inputs.run_unit_tests
        run: |
          set -x
          . ./${{ inputs.env_name }}/bin/activate

          PYTHON_LIB_PATH=$(python3 -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")
          export LD_LIBRARY_PATH="${PYTHON_LIB_PATH}:${LD_LIBRARY_PATH}"
          for target in $(find downloads -name "*Test"); do
              chmod +x $target
              $target
          done

          PYTEST_TARGETS="./TrainingExtensions/common/test"

          if [ "${{ inputs.ver_onnxruntime }}" != "" ] ; then
              PYTEST_TARGETS="./ModelOptimizations/DlQuantization/test $PYTEST_TARGETS"
              PYTEST_TARGETS="$PYTEST_TARGETS ./TrainingExtensions/onnx/test"
          elif [ "${{ inputs.ver_torch }}" != "" ] ; then
              PYTEST_TARGETS="$PYTEST_TARGETS ./TrainingExtensions/torch/test"
          fi
          # Select all tests on GPU runners; skip cuda tests on CPU runners.
          PYTEST_ARGS=()
          if [ "${{ inputs.ver_cuda }}" = "" ] ; then
              PYTEST_ARGS=(-m "not cuda")
          fi
          python -m pytest "${PYTEST_ARGS[@]}" $PYTEST_TARGETS -c pyproject.toml -n 8
      - name: Run Acceptance tests
        if: inputs.run_acceptance_tests
        run: |
          set -x
          . ./${{ inputs.env_name }}/bin/activate

          # Set LD_LIBRARY_PATH for dynamic linking with libpython3.so
          PYTHON_LIB_PATH=$(python3 -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")
          export LD_LIBRARY_PATH="${PYTHON_LIB_PATH}:${LD_LIBRARY_PATH}"

          PYTEST_TARGETS="./NightlyTests/common"
          if [ "${{ inputs.ver_onnxruntime }}" != "" ] ; then
              PYTEST_TARGETS="$PYTEST_TARGETS ./NightlyTests/onnx"
          elif [ "${{ inputs.ver_torch }}" != "" ] ; then
              PYTEST_TARGETS="$PYTEST_TARGETS ./NightlyTests/torch"
              uv pip install wget
              python ./NightlyTests/torch/dependencies.py ./NightlyTests/torch/resnet18_eval_scores.csv
          fi
          # Select all tests on GPU runners; skip cuda tests on CPU runners.
          PYTEST_ARGS=()
          if [ "${{ inputs.ver_cuda }}" = "" ] ; then
              PYTEST_ARGS=(-m "not cuda")
          fi
          python -m pytest "${PYTEST_ARGS[@]}" $PYTEST_TARGETS -c pyproject.toml

  test_on_windows:
    name: Run AIMET unit and acceptance tests on Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner-label }}
    if: inputs.include_windows_tests && inputs.env_name == 'onnx-cpu' && (inputs.run_unit_tests || inputs.run_acceptance_tests)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: X64
            python-version: "3.10"
            wheel-arch: x64
            runner-label: aimet-windows-amd64
          - arch: ARM64
            python-version: "3.12"
            wheel-arch: arm64
            runner-label: aimet-windows-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Redirect temp directories to workspace for automated cleanup
        run: |
          $env:TEMP = "$env:GITHUB_WORKSPACE\temp"
          $env:TMP = "$env:GITHUB_WORKSPACE\temp"

      - name: Download built wheels
        uses: actions/download-artifact@v4
        with:
          name: "onnx-cpu-win-${{ matrix.wheel-arch }}-wheel"
          path: "downloads"

      - uses: ./.github/actions/setup-uv-env
        with:
          ENV_NAME: "onnx-cpu"
          VER_PYTHON: "${{ matrix.python-version }}"

      - name: Install AIMET-ONNX wheel
        run: |

          # Activate uv environment
          .\onnx-cpu\Scripts\Activate.ps1

          python -m ensurepip --upgrade
          python -m pip install uv

          # Install aimet-onnx
          # TODO #8090: cap onnxruntime at <=1.26, matching the Linux
          # onnx-cpu/onnx-gpu legs, so all three test against comparable ORT
          # versions. See the "Install test dependencies" step in test_on_linux.
          $wheel = Get-ChildItem -Path downloads -Filter "aimet_onnx*.whl" | Select-Object -First 1 -ExpandProperty FullName
          python -m uv pip install "$wheel[test]" "onnxruntime<=1.26" --extra-index-url="https://download.pytorch.org/whl/cpu" --index-strategy unsafe-best-match --native-tls

      - name: Run Unit tests
        if: inputs.run_unit_tests
        run: |

          # Activate uv environment
          .\onnx-cpu\Scripts\Activate.ps1

          # Run tests
          $pytest_args = "not cuda"
          Invoke-Expression "pytest -m `"$pytest_args`" -n 8 .\\ModelOptimizations\\DlQuantization\\test"
          Invoke-Expression "pytest -m `"$pytest_args`" -n 8 .\\TrainingExtensions\\common\\test\\python"
          # TODO: #6211 Move torch to onnx tests out of unit tests
          Invoke-Expression "pytest -m `"$pytest_args`" -n 8 .\\TrainingExtensions\\onnx\\test\\python --ignore .\\TrainingExtensions\\onnx\\test\\python\\test_torch_to_onnx.py"

      - name: Run Acceptance tests
        if: inputs.run_acceptance_tests
        run: |

          # Activate uv environment
          .\onnx-cpu\Scripts\Activate.ps1

          # Run tests
          $pytest_args = "not cuda"
          Invoke-Expression "pytest -m `"$pytest_args`" .\\NightlyTests\\onnx -n 8"

  test_on_macos:
    name: Run AIMET unit and acceptance tests on macOS (ARM64)
    runs-on: aimet-mac-arm64
    if: inputs.include_macos_tests && inputs.env_name == 'onnx-cpu' && (inputs.run_unit_tests || inputs.run_acceptance_tests)
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Download built wheel
        uses: actions/download-artifact@v4
        with:
          name: "onnx-cpu-macos-arm64-wheel"
          path: "downloads"

      - name: Download compiled C++ unit tests
        if: inputs.run_unit_tests
        uses: actions/download-artifact@v4
        with:
          name: "onnx-cpu-macos-arm64-tests"
          path: "downloads"

      - uses: ./.github/actions/setup-uv-env
        with:
          ENV_NAME: "onnx-cpu"
          VER_PYTHON: "3.12"

      - name: Install AIMET-ONNX wheel
        run: |
          set -x

          # Activate uv environment
          . ./onnx-cpu/bin/activate

          # Install aimet-onnx
          # TODO #8090: cap onnxruntime at <=1.26, matching the Linux
          # onnx-cpu/onnx-gpu legs, so all three test against comparable ORT
          # versions. See the "Install test dependencies" step in test_on_linux.
          wheel=$(find downloads -name "aimet_onnx*.whl" | head -n 1)
          uv pip install --native-tls "$wheel[test]" "onnxruntime<=1.26" --extra-index-url="https://download.pytorch.org/whl/cpu" --index-strategy unsafe-best-match

      - name: Run Unit tests
        if: inputs.run_unit_tests
        run: |
          set -x

          # Activate uv environment
          . ./onnx-cpu/bin/activate

          # Run compiled C++ unit tests (ModelOptimizations/DlQuantization)
          for target in $(find downloads -name "*Test"); do
              chmod +x $target
              $target
          done

          # Run Python unit tests
          pytest -m "not cuda" -n 8 TrainingExtensions/common/test/python
          # TODO: #6211 Move torch to onnx tests out of unit tests
          pytest -m "not cuda" -n 8 TrainingExtensions/onnx/test/python --ignore TrainingExtensions/onnx/test/python/test_torch_to_onnx.py

      - name: Run Acceptance tests
        if: inputs.run_acceptance_tests
        run: |
          set -x

          # Activate uv environment
          . ./onnx-cpu/bin/activate

          # Run tests
          pytest -m "not cuda" NightlyTests/onnx -n 8

