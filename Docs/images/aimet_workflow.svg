<svg xmlns="http://www.w3.org/2000/svg" class="aimet-flow" viewBox="0 0 840 312" role="img" aria-labelledby="aimet-flow-title aimet-flow-desc" data-lumina-zoom="">
  <title id="aimet-flow-title">How AIMET fits into a deployment workflow</title>
  <desc id="aimet-flow-desc">A trained PyTorch or ONNX model goes into AIMET. AIMET simulates quantization, you evaluate the
    simulated model's accuracy, and if it is below target you apply improvement techniques (post-training quantization,
    mixed precision, quantization-aware training) and evaluate again. Once accuracy meets the target, AIMET exports an
    ONNX model with encodings, or an ONNX QDQ model, which you deploy with Qualcomm AI Hub, QAIRT, or ONNX Runtime.</desc>
  <!--
    This file is inlined into the page (`.. raw:: html` with `:file:`) rather than referenced with
    `.. image::`, so the colors below can read the aimet-dia color tokens in _static/aimet-lumina.css and follow
    the light/dark toggle. The fallback values are the light palette, used when the file is opened on its own.
    Every selector and id is prefixed (aimet-flow, af-) because an inline SVG shares the page's CSS and ids.
  -->
  <style>
    .aimet-flow { width: 100%; height: auto; display: block; margin-block: 1.75rem;
      font-family: var(--lumina-font-sans, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif);
      --af-1: var(--aimet-dia-1, #2323c4); --af-2: var(--aimet-dia-2, #0f766e); --af-3: var(--aimet-dia-3, #6d28d9);
      --af-card: var(--aimet-dia-card, #fcfcfd); --af-io: var(--aimet-dia-io, #f3f4f8);
      --af-edge: var(--aimet-dia-edge, #dde1ea); --af-ink: var(--aimet-dia-ink, #1e2230);
      --af-muted: var(--aimet-dia-ink-muted, #586075); --af-panel: var(--aimet-dia-panel, #e8e8fb);
      --af-panel-edge: var(--aimet-dia-panel-edge, #a9a9f5); --af-brand: var(--aimet-blue, #2a2aea); }
    .aimet-flow .af-c1 { --af-c: var(--af-1); }
    .aimet-flow .af-c2 { --af-c: var(--af-2); }
    .aimet-flow .af-c3 { --af-c: var(--af-3); }
    .aimet-flow .af-ink { --af-c: var(--af-muted); }

    .aimet-flow .af-panel { fill: var(--af-panel); stroke: var(--af-panel-edge); stroke-width: 1.25; }
    .aimet-flow .af-brand-pill { fill: var(--af-brand); }
    .aimet-flow .af-brand { fill: #ffffff; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; }
    .aimet-flow .af-panel-sub { fill: var(--af-muted); font-size: 12.5px; }

    .aimet-flow .af-card { fill: var(--af-card); stroke: var(--af-edge); stroke-width: 1; }
    .aimet-flow .af-card.af-io { fill: var(--af-io); }
    .aimet-flow .af-card.af-c2, .aimet-flow .af-card.af-c3 {
      stroke: color-mix(in srgb, var(--af-c) 45%, transparent); stroke-width: 1.25; }
    .aimet-flow .af-shadow-color { flood-color: #1e2230; flood-opacity: 0.08; }

    .aimet-flow .af-title { fill: var(--af-ink); font-size: 15.5px; font-weight: 600; }
    .aimet-flow .af-title.af-center { font-size: 14.5px; }
    .aimet-flow .af-sub { fill: var(--af-muted); font-size: 12.5px; }
    .aimet-flow .af-note { fill: var(--af-c); font-size: 12px; font-weight: 600; }

    .aimet-flow .af-badge { fill: color-mix(in srgb, var(--af-c) 14%, var(--af-card)); }
    .aimet-flow .af-badge-num { fill: var(--af-c); font-size: 12.5px; font-weight: 700; }
    .aimet-flow .af-chip { fill: color-mix(in srgb, var(--af-c) 11%, var(--af-card));
      stroke: color-mix(in srgb, var(--af-c) 30%, transparent); stroke-width: 1; }
    .aimet-flow .af-chip-text { fill: var(--af-c); font-size: 12px; font-weight: 600; }
    .aimet-flow .af-icon { fill: none; stroke: var(--af-c); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .aimet-flow .af-icon .af-icon-faint { stroke-dasharray: 2 2.5; opacity: 0.45; }
    .aimet-flow .af-icon .af-icon-dot { fill: var(--af-c); stroke: none; }
    .aimet-flow .af-icon .af-icon-knob { fill: var(--af-card); }

    .aimet-flow .af-net-edges line { stroke: var(--af-edge); stroke-width: 0.9; }
    .aimet-flow .af-net-1 { fill: var(--af-1); }
    .aimet-flow .af-net-2 { fill: var(--af-2); }
    .aimet-flow .af-net-3 { fill: var(--af-muted); }

    .aimet-flow .af-target { fill: var(--af-card); stroke: var(--af-edge); stroke-width: 1; }
    .aimet-flow .af-target-text { fill: var(--af-ink); font-size: 12px; font-weight: 500; }

    .aimet-flow .af-arrow { stroke: var(--af-muted); stroke-width: 1.5; fill: none; }
    .aimet-flow .af-arrow.af-ok { stroke: var(--af-3); }
    .aimet-flow .af-arrow-head { fill: var(--af-muted); }
    .aimet-flow .af-ok-head-fill { fill: var(--af-3); }
    .aimet-flow .af-loop { stroke: var(--af-2); stroke-width: 1.5; fill: none; }
    .aimet-flow .af-loop-head-fill { fill: var(--af-2); }
  </style>
  <defs>
    <filter id="af-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow class="af-shadow-color" dx="0" dy="1.5" stdDeviation="2"/>
    </filter>
    <marker id="af-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="af-arrow-head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="af-ok-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="af-ok-head-fill" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="af-loop-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="af-loop-head-fill" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="af-card af-io" x="1" y="58" width="118" height="116" rx="12" filter="url(#af-shadow)"/>
  <g class="af-net-edges"><line x1="43" y1="79" x2="60" y2="74.5"/><line x1="43" y1="79" x2="60" y2="83.5"/><line x1="43" y1="79" x2="60" y2="92.5"/><line x1="43" y1="79" x2="60" y2="101.5"/><line x1="43" y1="88" x2="60" y2="74.5"/><line x1="43" y1="88" x2="60" y2="83.5"/><line x1="43" y1="88" x2="60" y2="92.5"/><line x1="43" y1="88" x2="60" y2="101.5"/><line x1="43" y1="97" x2="60" y2="74.5"/><line x1="43" y1="97" x2="60" y2="83.5"/><line x1="43" y1="97" x2="60" y2="92.5"/><line x1="43" y1="97" x2="60" y2="101.5"/><line x1="60" y1="74.5" x2="77" y2="83.5"/><line x1="60" y1="74.5" x2="77" y2="92.5"/><line x1="60" y1="83.5" x2="77" y2="83.5"/><line x1="60" y1="83.5" x2="77" y2="92.5"/><line x1="60" y1="92.5" x2="77" y2="83.5"/><line x1="60" y1="92.5" x2="77" y2="92.5"/><line x1="60" y1="101.5" x2="77" y2="83.5"/><line x1="60" y1="101.5" x2="77" y2="92.5"/></g><circle class="af-net-1" cx="43" cy="79" r="3.6"/><circle class="af-net-1" cx="43" cy="88" r="3.6"/><circle class="af-net-1" cx="43" cy="97" r="3.6"/><circle class="af-net-2" cx="60" cy="74.5" r="3.6"/><circle class="af-net-2" cx="60" cy="83.5" r="3.6"/><circle class="af-net-2" cx="60" cy="92.5" r="3.6"/><circle class="af-net-2" cx="60" cy="101.5" r="3.6"/><circle class="af-net-3" cx="77" cy="83.5" r="3.6"/><circle class="af-net-3" cx="77" cy="92.5" r="3.6"/>
  <text class="af-title af-center" x="60" y="134" text-anchor="middle">Trained model</text>
  <text class="af-sub" x="60" y="154" text-anchor="middle">PyTorch or ONNX</text>
  <path class="af-arrow" d="M121,118.0 L139,118.0" marker-end="url(#af-head)"/>
  <rect class="af-panel" x="142" y="6" width="548" height="300" rx="18"/>
  <rect class="af-brand-pill" x="160" y="22" width="68" height="24" rx="12"/>
  <text class="af-brand" x="194" y="38.5" text-anchor="middle">AIMET</text>
  <text class="af-panel-sub" x="240" y="38.5">Simulate, measure and recover accuracy before you deploy</text>
  <rect class="af-card " x="160" y="74" width="158" height="88" rx="12" filter="url(#af-shadow)"/>
  <circle class="af-badge af-c1" cx="184" cy="100" r="11"/><text class="af-badge-num af-c1" x="184" y="104.5" text-anchor="middle">1</text>
  <text class="af-title" x="203" y="105">Simulate</text>
  <g class="af-icon af-c1" transform="translate(286,91)"><path class="af-icon-faint" d="M0,16 L16,0"/><path d="M0,15 H4 V11 H8 V7 H12 V3 H16"/></g>
  <text class="af-sub" x="176" y="130">Insert quantizers,</text>
  <text class="af-sub" x="176" y="148">calibrate encodings</text>
  <path class="af-arrow" d="M319,118.0 L335,118.0" marker-end="url(#af-head)"/>
  <rect class="af-card " x="338" y="74" width="156" height="88" rx="12" filter="url(#af-shadow)"/>
  <circle class="af-badge af-c1" cx="362" cy="100" r="11"/><text class="af-badge-num af-c1" x="362" y="104.5" text-anchor="middle">2</text>
  <text class="af-title" x="381" y="105">Evaluate</text>
  <g class="af-icon af-c1" transform="translate(462,91)"><path d="M1,14 A7.5,7.5 0 0 1 16,14"/><path d="M8.5,14 L12.5,7.5"/><circle class="af-icon-dot" cx="8.5" cy="14" r="1.4"/></g>
  <text class="af-sub" x="354" y="130">Measure accuracy</text>
  <text class="af-sub" x="354" y="148">of the simulation</text>
  <path class="af-arrow af-ok" d="M495,118.0 L513,118.0" marker-end="url(#af-ok-head)"/>
  <text class="af-note af-c3" x="504" y="64" text-anchor="middle">target met</text>
  <rect class="af-card af-c3" x="516" y="74" width="158" height="88" rx="12" filter="url(#af-shadow)"/>
  <circle class="af-badge af-c3" cx="540" cy="100" r="11"/><text class="af-badge-num af-c3" x="540" y="104.5" text-anchor="middle">4</text>
  <text class="af-title" x="559" y="105">Export</text>
  <g class="af-icon af-c3" transform="translate(642,91)"><path d="M2,7 V15.5 H15 V7"/><path d="M8.5,1 V10.5"/><path d="M5.2,4.2 L8.5,1 L11.8,4.2"/></g>
  <text class="af-sub" x="532" y="130">ONNX + encodings,</text>
  <text class="af-sub" x="532" y="148">or ONNX QDQ</text>
  <path class="af-loop" d="M400,163 L400,205" marker-end="url(#af-loop-head)"/>
  <path class="af-loop" d="M432,205 L432,165" marker-end="url(#af-loop-head)"/>
  <rect class="af-chip af-c2" x="300" y="173" width="92" height="22" rx="11.0"/><text class="af-chip-text af-c2" x="346.0" y="188.0" text-anchor="middle">below target</text>
  <rect class="af-chip af-c2" x="440" y="173" width="84" height="22" rx="11.0"/><text class="af-chip-text af-c2" x="482.0" y="188.0" text-anchor="middle">re-evaluate</text>
  <rect class="af-card af-c2" x="260" y="208" width="312" height="84" rx="12" filter="url(#af-shadow)"/>
  <circle class="af-badge af-c2" cx="284" cy="234" r="11"/><text class="af-badge-num af-c2" x="284" y="238.5" text-anchor="middle">3</text>
  <text class="af-title" x="303" y="239">Improve</text>
  <g class="af-icon af-c2" transform="translate(540,225)"><path d="M0,4 H16 M0,12 H16"/><circle class="af-icon-knob" cx="5" cy="4" r="2.3"/><circle class="af-icon-knob" cx="11" cy="12" r="2.3"/></g>
  <rect class="af-chip af-c2" x="276" y="256" width="108" height="22" rx="11.0"/><text class="af-chip-text af-c2" x="330.0" y="271.0" text-anchor="middle">PTQ techniques</text>
  <rect class="af-chip af-c2" x="392" y="256" width="112" height="22" rx="11.0"/><text class="af-chip-text af-c2" x="448.0" y="271.0" text-anchor="middle">Mixed precision</text>
  <rect class="af-chip af-c2" x="512" y="256" width="44" height="22" rx="11.0"/><text class="af-chip-text af-c2" x="534.0" y="271.0" text-anchor="middle">QAT</text>
  <path class="af-arrow" d="M691,118.0 L707,118.0" marker-end="url(#af-head)"/>
  <rect class="af-card af-io" x="710" y="44" width="129" height="142" rx="12" filter="url(#af-shadow)"/>
  <g class="af-icon af-ink" transform="translate(724,59)"><rect x="1" y="1" width="14" height="14" rx="3"/><path d="M5,1 V-2 M11,1 V-2 M5,15 V18 M11,15 V18 M1,5 H-2 M1,11 H-2 M15,5 H18 M15,11 H18"/></g>
  <text class="af-title" x="750" y="72">Deploy</text>
  <rect class="af-target" x="720" y="88" width="109" height="24" rx="7"/>
  <text class="af-target-text" x="774.5" y="104" text-anchor="middle">Qualcomm AI Hub</text>
  <rect class="af-target" x="720" y="118" width="109" height="24" rx="7"/>
  <text class="af-target-text" x="774.5" y="134" text-anchor="middle">QAIRT</text>
  <rect class="af-target" x="720" y="148" width="109" height="24" rx="7"/>
  <text class="af-target-text" x="774.5" y="164" text-anchor="middle">ONNX Runtime</text>
</svg>
