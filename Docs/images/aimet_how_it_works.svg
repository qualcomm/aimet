<svg xmlns="http://www.w3.org/2000/svg" class="aimet-hw" viewBox="0 0 715 177" role="img" aria-labelledby="aimet-hw-title aimet-hw-desc" data-lumina-zoom="">
  <title id="aimet-hw-title">How AIMET works</title>
  <desc id="aimet-hw-desc">A trained PyTorch or ONNX model goes through the AI Model Efficiency Toolkit and comes out
    as a smaller quantized model, which is deployed to devices such as cars, phones and IoT devices.</desc>
  <!--
    Inlined into the page (`.. raw:: html` with `:file:`) rather than referenced with `.. image::`, so the colors read the
    aimet-hw color tokens in _static/aimet-lumina.css and follow the light/dark toggle. The fallback values are the
    light palette, used when the file is opened on its own. Every selector is scoped to .aimet-hw because an inline
    SVG's <style> applies to the whole page.
  -->
  <style>
    .aimet-hw { width: 100%; height: auto; display: block; margin-block: 1.75rem;
      font-family: var(--lumina-font-sans, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif); }
    .aimet-hw .hw-edges line { stroke: var(--aimet-hw-edge, #c3cbda); stroke-width: 0.8; }
    .aimet-hw .hw-n1 { fill: var(--aimet-hw-blue, #3555df); }
    .aimet-hw .hw-n2 { fill: var(--aimet-hw-teal, #4ca3b6); }
    .aimet-hw .hw-n3 { fill: var(--aimet-hw-slate, #4c5a76); }
    .aimet-hw .hw-n4 { fill: var(--aimet-hw-gray, #aebad0); }
    .aimet-hw .hw-arrow { stroke: var(--aimet-hw-blue, #3555df); stroke-width: 1.2; fill: none; }
    .aimet-hw .hw-arrow-head { fill: var(--aimet-hw-blue, #3555df); }
    .aimet-hw .hw-title { fill: var(--aimet-hw-blue, #3555df); font-weight: 700; font-size: 14px; }
    .aimet-hw .hw-sub { fill: var(--aimet-hw-text, #2b3140); font-size: 8px; }
    .aimet-hw .hw-box { fill: var(--aimet-hw-box, #3555df); }
    .aimet-hw .hw-box-text { fill: #ffffff; font-size: 12.5px; font-weight: 500; }
    .aimet-hw .hw-on-blue { fill: #ffffff; }
    .aimet-hw .hw-on-blue-stroke { stroke: #ffffff; fill: none; }
  </style>
  <defs>
    <marker id="hw-head" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto">
      <path class="hw-arrow-head" d="M0,0.5 L6,3 L0,5.5 z"/>
    </marker>
  </defs>

<!-- Trained -->
<text class="hw-title" x="30" y="33">Trained</text>
<text class="hw-sub" x="30" y="47">AI model</text>
<g class="hw-edges"><line x1="37" y1="83" x2="80" y2="72.5"/><line x1="37" y1="83" x2="80" y2="94.5"/><line x1="37" y1="83" x2="80" y2="116.5"/><line x1="37" y1="83" x2="80" y2="138"/><line x1="37" y1="105" x2="80" y2="72.5"/><line x1="37" y1="105" x2="80" y2="94.5"/><line x1="37" y1="105" x2="80" y2="116.5"/><line x1="37" y1="105" x2="80" y2="138"/><line x1="37" y1="127.5" x2="80" y2="72.5"/><line x1="37" y1="127.5" x2="80" y2="94.5"/><line x1="37" y1="127.5" x2="80" y2="116.5"/><line x1="37" y1="127.5" x2="80" y2="138"/><line x1="80" y1="72.5" x2="121.5" y2="72.5"/><line x1="80" y1="72.5" x2="121.5" y2="94.5"/><line x1="80" y1="72.5" x2="121.5" y2="116.5"/><line x1="80" y1="72.5" x2="121.5" y2="138"/><line x1="80" y1="94.5" x2="121.5" y2="72.5"/><line x1="80" y1="94.5" x2="121.5" y2="94.5"/><line x1="80" y1="94.5" x2="121.5" y2="116.5"/><line x1="80" y1="94.5" x2="121.5" y2="138"/><line x1="80" y1="116.5" x2="121.5" y2="72.5"/><line x1="80" y1="116.5" x2="121.5" y2="94.5"/><line x1="80" y1="116.5" x2="121.5" y2="116.5"/><line x1="80" y1="116.5" x2="121.5" y2="138"/><line x1="80" y1="138" x2="121.5" y2="72.5"/><line x1="80" y1="138" x2="121.5" y2="94.5"/><line x1="80" y1="138" x2="121.5" y2="116.5"/><line x1="80" y1="138" x2="121.5" y2="138"/><line x1="121.5" y1="72.5" x2="164" y2="94.5"/><line x1="121.5" y1="72.5" x2="164" y2="116.5"/><line x1="121.5" y1="94.5" x2="164" y2="94.5"/><line x1="121.5" y1="94.5" x2="164" y2="116.5"/><line x1="121.5" y1="116.5" x2="164" y2="94.5"/><line x1="121.5" y1="116.5" x2="164" y2="116.5"/><line x1="121.5" y1="138" x2="164" y2="94.5"/><line x1="121.5" y1="138" x2="164" y2="116.5"/></g>
