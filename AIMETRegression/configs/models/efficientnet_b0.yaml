model_name: efficientnet_b0

tests:
  - name: quantsim_int8_int16
    feature: quantsim
    quant_scheme: min_max
    param_type: int8
    activation_type: int16
    config_file: htp_v81
    apply_experimental_static_aten_calibration: true
    # Observed 1.8% drop after the eval/calibration dataset change (#7948, qai-hub-models 0.64).
    max_accuracy_drop_torch: 2.0
    max_accuracy_drop_onnx: 2.0

  - name: lite_mp_10
    feature: lite_mp
    quant_scheme: min_max
    param_type: int8
    activation_type: int8
    config_file: htp_v79
    # Observed 1.6% drop after the eval/calibration dataset change (#7948, qai-hub-models 0.64).
    max_accuracy_drop_onnx: 1.8
