model_name: densenet121
qnn_options: "--target_runtime qnn_dlc --output_names class_logits --force_channel_last_input image_tensor"

tests:
  - name: quantsim_int8_v79
    feature: quantsim
    quant_scheme: min_max
    param_type: int8
    activation_type: int8
    config_file: htp_v79
    max_accuracy_drop_torch: 4.5
    max_accuracy_drop_onnx: 4.1
    apply_experimental_static_aten_calibration: true

  - name: amp_int8_int16
    feature: mixed_precision
    candidates: int8_int16
    enable_sqnr_pruning: true
    phase1_samples: 64
    phase2_samples: 256
    allowed_accuracy_drop: 0.01
    config_file: htp_v81
    calib_samples: 256
    eval_samples: 256
    max_accuracy_drop_onnx: 3.5
    # Observed 1.953% drop after the eval/calibration dataset change (#7948, qai-hub-models 0.64).
    max_accuracy_drop_torch: 2.153
