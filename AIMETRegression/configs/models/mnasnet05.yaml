model_name: mnasnet05
qnn_options: "--target_runtime qnn_dlc --output_names class_logits --force_channel_last_input image_tensor"

tests:
  - name: quantsim_int8_int16
    feature: quantsim
    quant_scheme: min_max
    param_type: int8
    activation_type: int16
    config_file: htp_v79
    # Observed 1.6% drop after the eval/calibration dataset change (#7948, qai-hub-models 0.64).
    max_accuracy_drop_torch: 1.8
    max_accuracy_drop_onnx: 1.8
