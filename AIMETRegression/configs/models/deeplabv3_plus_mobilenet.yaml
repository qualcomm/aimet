model_name: deeplabv3_plus_mobilenet

tests:
  - name: quantsim_int8_v79
    feature: quantsim
    quant_scheme: min_max
    param_type: int8
    activation_type: int8
    config_file: htp_v79
    # Observed 4.379% (onnx) / 4.5% (torch) drop after the eval/calibration dataset change (#7948, qai-hub-models 0.64).
    max_accuracy_drop_torch: 4.7
    max_accuracy_drop_onnx: 4.579
    apply_experimental_static_aten_calibration: true

  - name: adaround_500
    feature: adaround
    quant_scheme: min_max
    param_type: int8
    activation_type: int8
    config_file: htp_v79
    adaround_iters: 500
    max_accuracy_drop_torch: 2.1
    # Aligned with the torch threshold; observed drop is 1.693% while eval runs on coco_voc_seg instead of pascal_voc.
    max_accuracy_drop_onnx: 2.1
    skip_torch: true
